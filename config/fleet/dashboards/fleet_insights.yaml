name: fleet_insights
label: "Fleet insights"
description: "Figures and charts that reproduce the fleet overview report."
default_range: last_30_days
tiles:
  - metric: fleet_trips_count_planned
  - metric: fleet_trips_count_on_the_road
  - metric: fleet_trips_count_delivered
  - metric: fleet_trips_count_cancelled
charts:
  - id: fuel_cost_by_vehicle
    title: "Fuel cost by vehicle"
    kind: bar
    metrics: [fleet_fuel_cost]
    by: vehicle
  - id: distance_by_vehicle
    title: "Distance by vehicle (km)"
    kind: bar
    metrics: [fleet_trip_distance_km]
    by: vehicle
