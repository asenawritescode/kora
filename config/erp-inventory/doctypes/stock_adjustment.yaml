name: Stock Adjustment
module: Stock
append_only: true
title_field: reference
search_fields: reference, reason
sort_field: creation
sort_order: DESC
description: >-
  A signed change to a product's stock with a reason. Saving it changes the
  product's stock in the same step, from any screen or the API. It cannot be
  edited afterwards; fix a mistake with another adjustment.
quantity_effect:
  target_doctype: Product
  target_quantity_field: stock_qty
  source_record_field: product
  delta_field: delta
  reason_field: reason

fields:
  - fieldname: reference
    fieldtype: Data
    label: Reference
    reqd: true
    unique: true
    in_list_view: true
  - fieldname: product
    fieldtype: Link
    options: Product
    label: Product
    reqd: true
    in_list_view: true
    in_standard_filter: true
  - fieldname: delta
    fieldtype: Float
    label: Quantity change
    description: Positive to add stock, negative to remove it. Stock cannot go below zero.
    reqd: true
    in_list_view: true
  - fieldname: reason
    fieldtype: Select
    label: Reason
    options: |
      Opening balance
      Count correction
      Damaged
      Lost or stolen
      Found
      Other
    reqd: true
    in_list_view: true
    in_standard_filter: true
  - fieldname: note
    fieldtype: Text
    label: Note
  - fieldname: adjusted_by
    fieldtype: User
    label: Adjusted by
    read_only: true
