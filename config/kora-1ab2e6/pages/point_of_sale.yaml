apiVersion: ui.kora.dev/v1
kind: Page
metadata:
    name: Point of Sale
    package: tenant.workspace
    status: draft
    version: 0.1.0
spec:
    actions:
        - command: local_cart_add
          id: tap
          input: null
          invalidate: []
        - command: create_transaction
          id: complete_sale
          input:
            child_table: Sale Item
            decrement_stock: true
            fields:
                sale_datetime: $now
            idempotency_prefix: pos-sale
            line_defaults:
                quantity: 1
            line_fields:
                product: product
                quantity: quantity
                unit_price: rate
            line_records:
                - doctype: Stock Movement
                  fields:
                    adjusted_at: $parent.sale_datetime
                    movement_type: Sale
                    posted_by: $actor
                    product: $line.product
                    reason: POS sale
                    source_reference: $parent.reference
                    source_sale: $records.sale.name
                  key: stock_movement
                  quantity:
                    field: delta
                    sign: -1
                    source_field: quantity
            line_source: cart
            reference_field: reference
            reference_prefix: POS
            related_numeric_updates:
                - doctype: Shift
                  field: sales_count
                  record_field: shift
                  value: 1
                - doctype: Shift
                  field: total_sales
                  record_field: shift
                  source_field: total_amount
                - doctype: Till Session
                  field: sales_count
                  record_field: till_session
                  value: 1
                - doctype: Till Session
                  field: cash_sales
                  record_field: till_session
                  source_field: total_amount
                  when:
                    equals: Cash
                    field: payment_method
                - doctype: Till Session
                  field: expected_cash
                  record_field: till_session
                  source_field: total_amount
                  when:
                    equals: Cash
                    field: payment_method
            required_related_status:
                - doctype: Shift
                  record_field: shift
                  status_field: status
                  equals: Open
                - doctype: Till Session
                  record_field: till_session
                  status_field: status
                  equals: Open
            related_quantity_updates:
                source_quantity_field: quantity
                source_record_field: product
                target_doctype: Product
                target_quantity_field: stock_qty
                whole_units: true
            target_doctype: Sale
            totals:
                lines:
                    line_total_field: line_amount
                    quantity_field: quantity
                    unit_price_field: unit_price
                total_field: total_amount
          invalidate:
            - primary
        - command: create_record
          id: open_shift
          input:
            target_doctype: Shift
          invalidate: []
        - command: create_record
          id: open_till_session
          input:
            target_doctype: Till Session
          invalidate: []
    capabilities: []
    layout:
        children:
            - component: category_tabs
              data: primary.data
              id: categories
              position: 0
              props:
                bindings:
                    group_field: category
                source_doctype: Product
                title: Categories
              region: main
              version: 1
            - actions:
                - tap
              component: product_grid
              data: primary.data
              id: products
              position: 1
              props:
                actions:
                    - config: null
                      id: tap
                      trigger: on_click
                      type: local_cart_add
                bindings:
                    badge: stock_qty
                    price: selling_price
                    subtitle: category
                    title: product_name
                source_doctype: Product
                title: Products
              region: main
              version: 1
            - component: cart_panel
              id: cart
              position: 0
              props:
                source_doctype: ""
                title: Current basket
              region: side
              version: 1
            - actions:
                - complete_sale
                - open_shift
                - open_till_session
              component: payment_panel
              id: payment
              position: 0
              props:
                actions:
                    - config:
                        child_table: Sale Item
                        decrement_stock: true
                        fields:
                            sale_datetime: $now
                        idempotency_prefix: pos-sale
                        line_defaults:
                            quantity: 1
                        line_fields:
                            product: product
                            quantity: quantity
                            unit_price: rate
                        line_records:
                            - doctype: Stock Movement
                              fields:
                                adjusted_at: $parent.sale_datetime
                                movement_type: Sale
                                posted_by: $actor
                                product: $line.product
                                reason: POS sale
                                source_reference: $parent.reference
                                source_sale: $records.sale.name
                              key: stock_movement
                              quantity:
                                field: delta
                                sign: -1
                                source_field: quantity
                        line_source: cart
                        reference_field: reference
                        reference_prefix: POS
                        related_numeric_updates:
                            - doctype: Shift
                              field: sales_count
                              record_field: shift
                              value: 1
                            - doctype: Shift
                              field: total_sales
                              record_field: shift
                              source_field: total_amount
                            - doctype: Till Session
                              field: sales_count
                              record_field: till_session
                              value: 1
                            - doctype: Till Session
                              field: cash_sales
                              record_field: till_session
                              source_field: total_amount
                              when:
                                equals: Cash
                                field: payment_method
                            - doctype: Till Session
                              field: expected_cash
                              record_field: till_session
                              source_field: total_amount
                              when:
                                equals: Cash
                                field: payment_method
                        required_related_status:
                            - doctype: Shift
                              record_field: shift
                              status_field: status
                              equals: Open
                            - doctype: Till Session
                              record_field: till_session
                              status_field: status
                              equals: Open
                        related_quantity_updates:
                            source_quantity_field: quantity
                            source_record_field: product
                            target_doctype: Product
                            target_quantity_field: stock_qty
                            whole_units: true
                        target_doctype: Sale
                        totals:
                            lines:
                                line_total_field: line_amount
                                quantity_field: quantity
                                unit_price_field: unit_price
                            total_field: total_amount
                      id: complete_sale
                      trigger: on_click
                      type: create_transaction
                    - config:
                        target_doctype: Shift
                        context_field: shift
                        label: Shift
                        reference_prefix: SHIFT
                        fields:
                            reference: $generated
                            status: Open
                            started_at: $now
                            cashier: $actor
                      id: open_shift
                      trigger: on_click
                      type: create_record
                    - config:
                        target_doctype: Till Session
                        context_field: till_session
                        label: Till Session
                        reference_prefix: TILL
                        depends_on: shift
                        inputs:
                            - field: opening_cash
                              label: Opening Cash
                              fieldtype: Currency
                              default: 0
                              required: true
                        fields:
                            reference: $generated
                            register: $binding.register
                            shift: $context.shift
                            opened_at: $now
                            opening_cash: $input.opening_cash
                            expected_cash: $input.opening_cash
                            status: Open
                      id: open_till_session
                      trigger: on_click
                      type: create_record
                bindings:
                    methods: literal:cash
                    register: literal:Main Counter
                source_doctype: Sale
                title: Take payment
              region: side
              version: 1
        columns: 12
        type: two_panel
    offline: read_only
    permissions: []
    resources:
        - id: primary
          params:
            doctype: Product
            limit: 50
          query: document.list
    route: /pos
    runtime: '>=2.0.0 <3.0.0'
