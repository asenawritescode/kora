name: Retail POS Register
route: /pos
type: register
layout: two_panel
label: Register
module: Retail POS and Store Operations
source_doctype: Product
resources:
  - id: categories
    query: document.list
    params:
      doctype: Product Category
      limit: 100
      fields: [name, category_name]
      order_by: display_order ASC
      filters:
        - field: is_active
          op: =
          value: 1
components:
  - id: categories
    type: category_tabs
    region: main
    position: 0
    label: Product categories
    source_doctype: Product
    data: primary.data
    resource_bindings:
      products: primary
      categories: categories
    bindings:
      group_field: category
      category_label_field: category_name
  - id: products
    type: product_grid
    region: main
    position: 1
    source_doctype: Product
    label: Products
    bindings:
      title: product_name
      subtitle: category
      price: selling_price
      badge: stock_qty
    actions:
      - id: tap
        trigger: on_click
        type: local_cart_add
  - id: cart
    type: cart_panel
    region: side
    position: 0
    label: Current basket
  - id: payments
    type: payment_panel
    region: side
    position: 1
    label: Take payment
    bindings:
      methods: "literal:cash"
      register: "literal:REG-001"
    actions:
      - id: complete_mobile
        trigger: on_click
        type: create_transaction
        config:
          target_doctype: Sale
          reference_field: reference
          reference_prefix: POS
          child_table: Sale Item
          line_source: cart
          line_fields:
            product: product
            unit_price: rate
            quantity: quantity
            discount_amount: discount_amount
            tax_amount: tax_amount
          line_defaults:
            quantity: 1
          requires_operation_status: Succeeded
          totals:
            subtotal_field: subtotal
            discount_total_field: discount_amount
            tax_total_field: tax_amount
            total_field: total
            lines:
              quantity_field: quantity
              unit_price_field: unit_price
              discount_field: discount_amount
              tax_field: tax_amount
              line_total_field: line_total
      - id: complete
        trigger: on_click
        type: create_transaction
        config:
          target_doctype: Sale
          reference_field: reference
          reference_prefix: POS
          child_table: Sale Item
          line_source: cart
          line_fields:
            product: product
            unit_price: rate
            quantity: quantity
            discount_amount: discount_amount
            tax_amount: tax_amount
          line_defaults:
            quantity: 1
          totals:
            subtotal_field: subtotal
            discount_total_field: discount_amount
            tax_total_field: tax_amount
            total_field: total
            lines:
              quantity_field: quantity
              unit_price_field: unit_price
              discount_field: discount_amount
              tax_field: tax_amount
              line_total_field: line_total
