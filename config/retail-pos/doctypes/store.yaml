name: Store
module: Retail Pos
title_field: reference
search_fields: reference, status
sort_field: modified
sort_order: DESC

fields:
  - fieldname: reference
    fieldtype: Data
    label: Reference
    reqd: true
    unique: true
    in_list_view: true
  - fieldname: source_record
    fieldtype: Data
    label: Source Record
    description: The original imported or external store reference, when applicable.
  - fieldname: assignee
    fieldtype: User
    label: Assignee
    description: Select the existing user responsible for this store.
  - fieldname: evidence
    fieldtype: Text
    label: Evidence
  - fieldname: status
    fieldtype: Data
    label: Status
    default: Draft
    in_list_view: true
