name: shipments_insights
label: "Shipments insights"
description: "Figures and charts that reproduce the shipments overview report."
default_range: last_30_days
tiles:
  - metric: shipments_count
  - metric: shipments_charge
charts:
  - id: shipments_by_status
    title: "Shipments by status"
    kind: bar
    metrics: [shipments_count]
    by: status
  - id: charge_by_status
    title: "Charge by status"
    kind: bar
    metrics: [shipments_charge]
    by: status
