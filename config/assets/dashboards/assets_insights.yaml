name: assets_insights
label: "Assets insights"
description: "Figures and charts that reproduce the assets overview report."
default_range: last_30_days
tiles:
  - metric: assets_count_in_use
  - metric: assets_count_in_store
  - metric: assets_count_under_repair
  - metric: assets_count_retired
  - metric: asset_maintenance_tasks_count_planned
  - metric: asset_maintenance_tasks_count_done
  - metric: asset_maintenance_tasks_count_cancelled
charts:
  - id: assets_by_category
    title: "Assets by category"
    kind: bar
    metrics: [assets_count]
    by: category
