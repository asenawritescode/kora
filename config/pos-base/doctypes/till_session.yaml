name: Till Session
module: Cash control
title_field: reference
search_fields: reference, status
sort_field: modified
sort_order: DESC
description: >-
  One cashier's turn at a register, from opening the drawer to counting it at
  close. Cash is counted in every currency the drawer holds.

fields:
  - fieldname: reference
    fieldtype: Data
    label: Reference
    reqd: true
    unique: true
    in_list_view: true
    search_index: true
  - fieldname: register
    fieldtype: Link
    options: Register
    label: Register
    in_list_view: true
    in_standard_filter: true
  - fieldname: register_code
    fieldtype: Data
    label: Register code
    description: The code of the register the till is at, for example REG-001. Sales keep the register as a code too.
    in_list_view: true
  - fieldname: opening_cash
    fieldtype: Currency
    label: Opening cash
    description: Cash in the drawer when the till was opened, in the base currency.
    default: "0"
  - fieldname: expected_cash
    fieldtype: Currency
    label: Expected cash
    description: Opening cash plus the cash taken at the register. Filled in by the register.
    default: "0"
    read_only: true
    in_list_view: true
  - fieldname: closing_cash
    fieldtype: Currency
    label: Counted cash
    description: The cash counted in the drawer when the till is closed, in the base currency.
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Open
      Closed
    default: Open
    in_list_view: true
    in_standard_filter: true
  - fieldname: opened_by
    fieldtype: User
    label: Opened by
    read_only: true
  - fieldname: opened_at
    fieldtype: Datetime
    label: Opened at
    default: now
    in_list_view: true
  - fieldname: closed_by
    fieldtype: User
    label: Closed by
  - fieldname: closed_at
    fieldtype: Datetime
    label: Closed at
  - fieldname: counts
    fieldtype: Table
    options: Till Count
    label: Cash by currency
  - fieldname: notes
    fieldtype: Text
    label: Notes
doc_constraints:
  - type: field_dependency
    condition: "status == 'Closed'"
    require_fields: [closing_cash]
    message: "Count the cash in the drawer before closing the till."
  - type: immutable_after
    status_field: status
    status_values: [Closed]
    immutable_fields: [reference, register, register_code, opening_cash, expected_cash, opened_by, opened_at]
    message: "A closed till cannot be changed."
