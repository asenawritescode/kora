name: Sale
module: Selling
is_submittable: true
title_field: reference
search_fields: reference, status
sort_field: modified
sort_order: DESC
description: >-
  One sale. Prices and the total are in the sale currency. Leave Currency empty
  for the base currency. Base total is the same sale in the base currency, using
  the exchange rate frozen on the sale.

fields:
  - fieldname: reference
    fieldtype: Data
    label: Reference
    reqd: true
    unique: true
    in_list_view: true
    search_index: true
  - fieldname: sale_date
    fieldtype: Date
    label: Sale date
    reqd: true
    in_list_view: true
    in_standard_filter: true
  - fieldname: entry_source
    fieldtype: Select
    label: Entry source
    options: |
      POS
      Book entry
    default: Book entry
    in_list_view: true
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Draft
      Awaiting Payment
      Partially Paid
      Paid
      Refunded
      Cancelled
    default: Draft
    in_list_view: true
    in_standard_filter: true
  - fieldname: cashier
    fieldtype: User
    label: Recorded by
    read_only: true
  - fieldname: register
    fieldtype: Data
    label: Register code
    description: The code of the register that took the sale, for example REG-001.
    in_standard_filter: true
  - fieldname: customer
    fieldtype: Link
    options: Customer
    label: Customer
  - fieldname: currency
    fieldtype: Link
    options: Currency
    label: Currency
    description: Leave empty for the base currency.
    in_standard_filter: true
    in_list_view: true
  - fieldname: exchange_rate
    fieldtype: Float
    label: Exchange rate
    description: Base currency per one unit of the sale currency, frozen when the sale is made. 1 for the base currency.
    default: "1"
    linked_field: "currency.rate_to_base"
    constraints:
      - type: min
        value: 0.000001
        message: "The exchange rate must be more than zero."
  - fieldname: items
    fieldtype: Table
    label: Items
    options: Sale Item
    reqd: true
  - fieldname: subtotal
    fieldtype: Currency
    label: Subtotal
    computed: "SUM(items.line_total)"
    read_only: true
  - fieldname: discount_amount
    fieldtype: Currency
    label: Discount
    default: "0"
  - fieldname: tax_amount
    fieldtype: Currency
    label: Tax
    default: "0"
  - fieldname: total
    fieldtype: Currency
    label: Total
    default: "0"
    in_list_view: true
  - fieldname: base_total
    fieldtype: Currency
    label: Total in base currency
    computed: "(round (* (round total 9) (round exchange_rate 9)) 2)"
    read_only: true
    in_list_view: true
  - fieldname: notes
    fieldtype: Text
    label: Notes
