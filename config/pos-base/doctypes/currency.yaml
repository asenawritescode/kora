name: Currency
module: Setup
title_field: code
search_fields: code, currency_name
sort_field: code
sort_order: ASC
description: >-
  A currency the shop can sell, take payment or spend in. Exactly one record is
  the base currency (the one the books are kept in). Rates are typed in by a
  person; nothing here reads a rate feed.

fields:
  - fieldname: code
    fieldtype: Data
    label: Code
    description: Three-letter code, for example KES or USD.
    reqd: true
    unique: true
    in_list_view: true
    search_index: true
    constraints:
      - type: regex
        pattern: "^[A-Z]{3}$"
        message: "Use a three-letter capital code, for example KES."
  - fieldname: currency_name
    fieldtype: Data
    label: Name
    reqd: true
    in_list_view: true
  - fieldname: symbol
    fieldtype: Data
    label: Symbol
  - fieldname: is_base
    fieldtype: Check
    label: Base currency
    description: Tick for the one currency your books are kept in.
    default: "0"
    in_list_view: true
  - fieldname: rate_to_base
    fieldtype: Float
    label: Rate to base
    description: How much of the base currency one unit of this currency is worth today. Type it in by hand. The base currency is always 1.
    reqd: true
    default: "1"
    in_list_view: true
    constraints:
      - type: min
        value: 0.000001
        message: "The rate must be more than zero."
  - fieldname: rate_updated_on
    fieldtype: Date
    label: Rate updated on
  - fieldname: enabled
    fieldtype: Check
    label: In use
    default: "1"
    in_list_view: true
