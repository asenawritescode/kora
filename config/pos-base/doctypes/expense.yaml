name: Expense
module: Money out
title_field: reference
search_fields: reference, payee, category
sort_field: modified
sort_order: DESC
description: >-
  Money the shop spends. The amount is in the currency you paid in. Amount in
  base currency uses the exchange rate frozen on the expense.

fields:
  - fieldname: reference
    fieldtype: Data
    label: Reference
    reqd: true
    unique: true
    in_list_view: true
  - fieldname: expense_date
    fieldtype: Date
    label: Date
    reqd: true
    in_list_view: true
    in_standard_filter: true
  - fieldname: payee
    fieldtype: Data
    label: Paid to
    reqd: true
    in_list_view: true
  - fieldname: category
    fieldtype: Select
    label: Category
    options: |
      Stock purchase
      Rent
      Wages
      Utilities
      Transport
      Other
    reqd: true
    in_list_view: true
    in_standard_filter: true
  - fieldname: payment_method
    fieldtype: Select
    label: Paid by
    options: |
      Cash
      Card
      Bank Transfer
      Other
    default: Cash
  - fieldname: currency
    fieldtype: Link
    options: Currency
    label: Currency
    description: Leave empty for the base currency.
    in_standard_filter: true
  - fieldname: exchange_rate
    fieldtype: Float
    label: Exchange rate
    description: Base currency per one unit of the expense currency, frozen when the expense is recorded. 1 for the base currency.
    default: "1"
    linked_field: "currency.rate_to_base"
    constraints:
      - type: min
        value: 0.000001
        message: "The exchange rate must be more than zero."
  - fieldname: amount
    fieldtype: Currency
    label: Amount
    reqd: true
    in_list_view: true
    constraints:
      - type: min
        value: 0.000001
        message: "The amount must be more than zero."
  - fieldname: base_amount
    fieldtype: Currency
    label: Amount in base currency
    computed: "(round (* (round amount 9) (round exchange_rate 9)) 2)"
    read_only: true
    in_list_view: true
  - fieldname: reason
    fieldtype: Text
    label: What it was for
    reqd: true
  - fieldname: recorded_by
    fieldtype: User
    label: Recorded by
    read_only: true
