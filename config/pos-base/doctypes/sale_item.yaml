name: Sale Item
module: Selling
is_child_table: true
title_field: product
description: One line of a sale.

fields:
  - fieldname: product
    fieldtype: Link
    options: Product
    label: Product
    reqd: true
  - fieldname: quantity
    fieldtype: Float
    label: Quantity
    reqd: true
    default: "1"
    constraints:
      - type: min
        value: 0.000001
        message: "The quantity must be more than zero."
  - fieldname: unit_price
    fieldtype: Currency
    label: Unit price
    reqd: true
    linked_field: "product.selling_price"
  - fieldname: discount_amount
    fieldtype: Currency
    label: Discount
    default: "0"
  - fieldname: tax_amount
    fieldtype: Currency
    label: Tax
    default: "0"
  - fieldname: line_total
    fieldtype: Currency
    label: Line total
    computed: "(round (+ (- (* (round quantity 9) (round unit_price 9)) (round discount_amount 9)) (round tax_amount 9)) 2)"
    read_only: true
