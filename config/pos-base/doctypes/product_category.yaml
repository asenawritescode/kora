name: Product Category
module: Products
title_field: category_name
search_fields: category_name
sort_field: display_order
sort_order: ASC
description: A group of products shown as a tab on the register.

fields:
  - fieldname: category_name
    fieldtype: Data
    label: Category
    reqd: true
    unique: true
    in_list_view: true
  - fieldname: display_order
    fieldtype: Int
    label: Order on the register
    default: "0"
    in_list_view: true
  - fieldname: is_active
    fieldtype: Check
    label: Shown on the register
    default: "1"
    in_list_view: true
