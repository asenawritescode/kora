name: Customer
module: Selling
title_field: customer_name
search_fields: customer_name, phone, email
description: A person or business that buys from you.

fields:
  - fieldname: customer_name
    fieldtype: Data
    label: Name
    reqd: true
    in_list_view: true
    search_index: true
  - fieldname: phone
    fieldtype: Data
    label: Phone
    options: Phone
    in_list_view: true
  - fieldname: email
    fieldtype: Data
    label: Email
  - fieldname: preferred_currency
    fieldtype: Link
    options: Currency
    label: Preferred currency
  - fieldname: notes
    fieldtype: Text
    label: Notes
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Active
      Inactive
    default: Active
    in_list_view: true
