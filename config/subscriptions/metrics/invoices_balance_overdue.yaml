name: invoices_balance_overdue
label: "Balance due: Overdue"
type: simple
model: "Recurring Invoice"
measure:
  agg: sum
  field: balance
filters:
  - field: status
    op: "="
    value: "Overdue"
time: business_date
format: currency
description: "Balance due: Overdue from the Recurring Invoice records (sum)."
