name: invoices_total_overdue
label: "Invoiced: Overdue"
type: simple
model: "Recurring Invoice"
measure:
  agg: sum
  field: total
filters:
  - field: status
    op: "="
    value: "Overdue"
time: business_date
format: currency
description: "Invoiced: Overdue from the Recurring Invoice records (sum)."
