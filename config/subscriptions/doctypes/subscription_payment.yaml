name: Subscription Payment
module: Subscriptions
append_only: true
title_field: payment_reference
search_fields: payment_reference, provider_transaction_id
sort_field: paid_at
sort_order: DESC
quantity_effect:
  target_doctype: Recurring Invoice
  target_quantity_field: amount_paid
  source_record_field: invoice
  delta_field: amount
  direction: increase
description: Money received against a recurring invoice, entered by hand. Saving it adds the amount to the invoice's amount paid in the same step, and the invoice refuses it when it is more than the balance due or the invoice is a draft or void. It cannot be edited or removed afterwards. Nothing is charged to a card.

fields:
  - fieldname: payment_reference
    fieldtype: Data
    label: Payment reference
    reqd: true
    unique: true
    in_list_view: true
    search_index: true
  - fieldname: invoice
    fieldtype: Link
    options: Recurring Invoice
    label: Invoice
    reqd: true
    in_list_view: true
    in_standard_filter: true
  - fieldname: subscriber
    fieldtype: Link
    options: Subscriber
    label: Subscriber
    read_only: true
    linked_field: "invoice.subscriber"
  - fieldname: subscription
    fieldtype: Link
    options: Subscription
    label: Subscription
    read_only: true
    linked_field: "invoice.subscription"
  - fieldname: amount
    fieldtype: Currency
    label: Amount received
    reqd: true
    in_list_view: true
    constraints:
      - type: min
        value: 0.01
        message: "The amount must be more than zero."
  - fieldname: currency
    fieldtype: Select
    label: Currency
    options: |
      KES
      USD
      EUR
      GBP
    read_only: true
    linked_field: "invoice.currency"
  - fieldname: paid_at
    fieldtype: Datetime
    label: Paid at
    reqd: true
    in_list_view: true
  - fieldname: method
    fieldtype: Select
    label: Payment method
    options: |
      Cash
      Bank Transfer
      Card
      Mobile Money
      Other
    reqd: true
    in_list_view: true
    in_standard_filter: true
  - fieldname: provider
    fieldtype: Data
    label: Payment provider
  - fieldname: provider_transaction_id
    fieldtype: Data
    label: Provider transaction ID
    unique: true
  - fieldname: evidence
    fieldtype: Attach
    label: Receipt or evidence
