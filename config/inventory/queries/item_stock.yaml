name: item_stock
module_owner_id: inventory.core
capability: inventory.stock
operation: item_stock
source: Stock Balance
permission: read
scope: tenant
input:
  item: {type: string, max_length: 140}
  location: {type: string, max_length: 140}
filters:
  - {field: item, op: eq, value: $input.item, optional: true}
  - {field: location, op: eq, value: $input.location, optional: true}
fields: [name, item, location, quantity]
sort: [{field: item, dir: asc}]
offline_eligible: true
