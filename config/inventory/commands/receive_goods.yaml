name: receive_goods
namespace: inventory
version: 1
permission: create
input:
  record: Stock Movement
transaction:
  - create:
      record: Stock Movement
      values:
        reference: "$input.reference"
        item: "$input.item"
        location: "$input.location"
        quantity: "$input.quantity"
        movement_type: "Receive"
        reason: "$input.reason"
emit:
  - inventory.goods_receipt.recorded

