name: receive_stock
namespace: inventory
version: 1
module_owner_id: inventory.core
capability: inventory.movements
operation: receive_stock
presentation:
  title: Receive stock
permission: create
input:
  record: Stock Entry
transaction:
  - update:
      record: Stock Balance
      where:
        item: "$input.item"
        location: "$input.location"
      adjust:
        quantity: { increase: "$input.quantity" }
  - create:
      record: Stock Entry
      values:
        item: "$input.item"
        location: "$input.location"
        quantity: "$input.quantity"
        entry_type: "Receipt"
