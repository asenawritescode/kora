name: receive_stock
namespace: inventory
version: 1
module_owner_id: inventory.core
capability: inventory.movements
operation: receive_stock
presentation:
  title: Receive stock
permission: create
input:
  record: Stock Entry
require:
  # Serializes receipts for one item so two first receipts cannot both create
  # its Stock Balance.
  - lock:
      record: Item
      name: "$input.item"
transaction:
  - as: balance
    ensure:
      record: Stock Balance
      where:
        item: "$input.item"
        location: "$input.location"
      values:
        quantity: "0"
  - update:
      record: Stock Balance
      name: "$steps.balance.name"
      adjust:
        quantity: { increase: "$input.quantity" }
  - create:
      record: Stock Entry
      values:
        item: "$input.item"
        location: "$input.location"
        quantity: "$input.quantity"
        entry_type: "Receipt"
