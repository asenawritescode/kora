name: members_savings_insights
label: "Members and savings insights"
description: "Figures and charts that reproduce the members and savings overview report."
default_range: last_30_days
tiles:
  - metric: members_count
  - metric: loans_amount
charts:
  - id: members_by_status
    title: "Members by status"
    kind: bar
    metrics: [members_count]
    by: status
  - id: loans_by_status
    title: "Loan amount by status"
    kind: bar
    metrics: [loans_amount]
    by: status
