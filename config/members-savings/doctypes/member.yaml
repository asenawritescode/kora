name: Member
naming_series: MEM-.YYYY.-.#####
module: Members
title_field: member_name
search_fields: member_no, member_name, phone
sort_field: modified
sort_order: DESC
description: A person who belongs to the society or lender. The savings balance is kept by savings entries; loan balances are on each loan.

fields:
  - fieldname: member_no
    fieldtype: Data
    default_to_name: true
    description: Leave blank to use this record's number.
    label: Member number
    unique: true
    in_list_view: true
  - fieldname: member_name
    fieldtype: Data
    label: Name
    reqd: true
    in_list_view: true
    search_index: true
  - fieldname: phone
    fieldtype: Data
    label: Phone
    in_list_view: true
  - fieldname: id_number
    fieldtype: Data
    label: ID number
  - fieldname: joined_on
    fieldtype: Date
    label: Joined on
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Active
      Dormant
      Exited
    default: Active
    in_list_view: true
    in_standard_filter: true
  - fieldname: savings_balance
    fieldtype: Currency
    label: Savings balance
    read_only: true
    default: "0"
    description: Deposits less withdrawals, kept by savings entries.
