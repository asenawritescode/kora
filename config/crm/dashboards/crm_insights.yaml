name: crm_insights
label: "CRM insights"
description: "Figures and charts that reproduce the crm overview report."
default_range: last_30_days
tiles:
  - metric: crm_activities_count_open
  - metric: crm_activities_count_in_progress
  - metric: crm_activities_count_completed
  - metric: crm_activities_count_cancelled
charts:
  - id: pipeline_by_stage
    title: "Open pipeline value by stage"
    kind: bar
    metrics: [crm_open_deal_value]
    by: pipeline_stage
  - id: closed_deals_by_outcome
    title: "Closed deals by outcome"
    kind: bar
    metrics: [crm_closed_deal_count, crm_closed_deal_value]
    by: pipeline_stage
  - id: leads_by_stage
    title: "Leads by lifecycle stage"
    kind: bar
    metrics: [crm_leads_count]
    by: lifecycle_stage
