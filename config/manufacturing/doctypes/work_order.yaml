name: Work Order
module: Manufacturing
title_field: reference
search_fields: reference, status
sort_field: modified
sort_order: DESC
description: An instruction to make a quantity of a product from a recipe. It does not move stock; record what was made with a Production Run and what was used with Material Issues.

fields:
  - fieldname: reference
    fieldtype: Data
    label: Reference
    reqd: true
    unique: true
    in_list_view: true
    search_index: true
  - fieldname: bom
    fieldtype: Link
    options: Bill of Materials
    label: Recipe
    reqd: true
    in_list_view: true
    in_standard_filter: true
  - fieldname: quantity
    fieldtype: Float
    label: Quantity to make
    reqd: true
    default: "1"
    in_list_view: true
    constraints:
      - type: min
        value: 0.000001
        message: "The quantity must be more than zero."
  - fieldname: due_date
    fieldtype: Date
    label: Due date
    in_list_view: true
    in_standard_filter: true
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Planned
      In progress
      Done
      Cancelled
    default: Planned
    in_list_view: true
    in_standard_filter: true
  - fieldname: notes
    fieldtype: Text
    label: Notes
