name: open_till
module_owner_id: pos.core
capability: pos.till
operation: open_till
source: Till Session
permission: read
scope: tenant
input:
  shift: {type: string, max_length: 140}
filters:
  - {field: shift, op: eq, value: $input.shift}
  - {field: closing_count, op: is_null, value: true}
fields: [name, shift, opening_float, expected_cash, creation]
sort: [{field: creation, dir: desc}]
limit: 1
