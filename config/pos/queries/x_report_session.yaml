# X report header: the till session's register, cashier and start time. The
# start is creation, written by open_session in the same transaction that sets
# the Shift's started_at.
name: x_report_session
module_owner_id: pos.core
capability: pos.till
operation: x_report_session
source: Till Session
permission: read
scope: tenant
owner_field: cashier
input:
  till_session: {type: string, max_length: 140}
filters:
  - {field: name, op: eq, value: $input.till_session}
fields: [name, shift, register, cashier, status, creation]
limit: 1
