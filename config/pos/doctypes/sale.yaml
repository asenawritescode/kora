name: Sale
module_owner_id: pos.core
module_ownership_mode: commands_only
module_access: published
module: POS
naming_series: SALE-.YYYY.-.#####
title_field: register
search_fields: customer, register
sort_field: creation
sort_order: DESC
fields:
  - fieldname: register
    fieldtype: Link
    options: Register
    label: Register
    reqd: true
    search_index: true
    in_list_view: true
  - fieldname: location
    fieldtype: Link
    options: Location
    label: Location
    read_only: true
  - fieldname: till_session
    fieldtype: Link
    options: Till Session
    label: Till Session
  - fieldname: return_against
    fieldtype: Link
    options: Sale
    label: Return Against
  - fieldname: customer
    fieldtype: Data
    label: Customer
    search_index: true
  - fieldname: items
    fieldtype: Table
    options: Sale Item
    label: Items
    reqd: true
  - fieldname: payments
    fieldtype: Table
    options: Sale Payment
    label: Payments
  - fieldname: currency
    fieldtype: Data
    label: Currency
    default: KES
  - fieldname: total
    fieldtype: Currency
    options: currency
    label: Total
    computed: "SUM(items.amount)"
    in_list_view: true
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Draft
      Held
      Paid
      Void
      Return
    default: Draft
    in_list_view: true
  - fieldname: return_reason
    fieldtype: Select
    label: Return Reason
    options: |
      Damaged
      Wrong item
      Changed their mind
      Other
    description: Why the items came back. Set by return_sale on Return sales.
  - fieldname: held_name
    fieldtype: Data
    label: Held Name
    description: What the cashier named a held sale, or its held time.
  - fieldname: held_at
    fieldtype: Datetime
    label: Held At
  - fieldname: held_by
    fieldtype: Data
    label: Held By
doc_constraints:
  # Returns over the limit need owner approval; the approval flow is not built yet.
  # Same limit and message as pay-outs (cash_movement.yaml). The refund total is the
  # sum of the refund payment lines, which return_sale requires to equal the return total.
  - type: predicate
    condition: '(== status "Return")'
    predicate: '(<= (sum "payments" "amount") 1000)'
    message: Needs owner approval (coming soon)
facts:
  time: creation
  lines: items
  measures:
    - field: total
    - field: items.amount
    - field: items.quantity
  dimensions:
    - field: register
    - field: till_session
    - field: items.item
  status_field: status
  exclude_status:
    - Held
