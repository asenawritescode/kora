name: Sale Payment
module_owner_id: pos.core
module_ownership_mode: commands_only
module_access: published
module: POS
is_child_table: true
title_field: method
fields:
  - fieldname: method
    fieldtype: Select
    label: Method
    options: |
      Cash
      Card
      Mobile Money
    reqd: true
    in_list_view: true
  - fieldname: currency
    fieldtype: Data
    label: Currency
    default: KES
  - fieldname: amount
    fieldtype: Currency
    options: currency
    label: Amount
    reqd: true
    in_list_view: true
  - fieldname: reference
    fieldtype: Data
    label: Reference
    description: Payment intent id for a sale; a refund has none.
  - fieldname: payment_account
    fieldtype: Link
    options: Payment Account
    label: Payment Account
    description: Account a non-cash payment was received on; empty for cash.
  - fieldname: verification
    fieldtype: Select
    label: Verification
    options: |
      provider_confirmed
      manually_recorded
    description: How a non-cash payment was confirmed; empty for cash.
