name: Till Session
module_owner_id: pos.core
module_ownership_mode: commands_only
module_access: published
module: POS
title_field: shift
search_fields: shift
fields:
  - fieldname: shift
    fieldtype: Link
    options: Shift
    label: Shift
    reqd: true
    search_index: true
    in_list_view: true
  - fieldname: register
    fieldtype: Link
    options: Register
    label: Register
    read_only: true
    search_index: true
    in_list_view: true
  - fieldname: location
    fieldtype: Link
    options: Location
    label: Location
    read_only: true
  - fieldname: cashier
    fieldtype: User
    label: Cashier
    read_only: true
  - fieldname: opening_float
    fieldtype: Currency
    label: Opening Float
    reqd: true
    in_list_view: true
  - fieldname: closing_count
    fieldtype: Currency
    label: Closing Count
  - fieldname: opening_counts
    fieldtype: Table
    options: Till Count Line
    label: Opening Count
    description: Notes and coins counted into the till at open. Optional.
  - fieldname: closing_counts
    fieldtype: Table
    options: Till Count Line
    label: Closing Count Lines
    description: Notes and coins counted out of the till at close. Optional.
  - fieldname: expected_cash
    fieldtype: Currency
    label: Expected Cash
    read_only: true
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Open
      Closed
    default: Open
    in_list_view: true
  - fieldname: closed_at
    fieldtype: Datetime
    label: Closed At
  - fieldname: difference_reason
    fieldtype: Select
    label: Difference Reason
    options: |
      Wrong change given
      Pay-out not recorded
      Sale not rung up
      Don't know
    description: Why counted cash differs from expected. Required when the difference is over KES 100.
  - fieldname: difference_note
    fieldtype: Data
    label: Difference Note
    description: What happened, in the cashier's words.
  - fieldname: left_in_drawer
    fieldtype: Currency
    label: Left in Drawer
    description: Cash kept in the drawer for the next shift.
  - fieldname: taken_out
    fieldtype: Currency
    label: Taken Out
    read_only: true
    computed: "closing_count - left_in_drawer"
    description: Counted cash that leaves the till, kept by close_session.
  - fieldname: variance
    fieldtype: Currency
    label: Variance
    computed: "closing_count - expected_cash"
  - fieldname: opening_note
    fieldtype: Data
    label: Opening Note
    description: Why the opening float differs from what the last till left in the drawer.
  - fieldname: cash_sale_count
    fieldtype: Int
    label: Cash Sale Count
    default: 0
    read_only: true
    description: Cash payments taken on this till, kept by record_sale and void_sale.
  - fieldname: cash_sale_total
    fieldtype: Currency
    label: Cash Sales
    default: 0
    read_only: true
  - fieldname: cash_refund_count
    fieldtype: Int
    label: Cash Refund Count
    default: 0
    read_only: true
    description: Cash refund payments paid out of this till, kept by return_sale.
  - fieldname: cash_refund_total
    fieldtype: Currency
    label: Cash Refunds
    default: 0
    read_only: true
  - fieldname: payout_count
    fieldtype: Int
    label: Pay-out Count
    default: 0
    read_only: true
    description: Cash taken out of the drawer. Stays 0 until cash movements land.
  - fieldname: payout_total
    fieldtype: Currency
    label: Pay-outs
    default: 0
    read_only: true
  - fieldname: payin_count
    fieldtype: Int
    label: Pay-in Count
    default: 0
    read_only: true
    description: Cash put into the drawer. Stays 0 until cash movements land.
  - fieldname: payin_total
    fieldtype: Currency
    label: Pay-ins
    default: 0
    read_only: true
doc_constraints:
  - type: field_dependency
    condition: '(and (== status "Closed") (or (> (- closing_count expected_cash) 100) (> (- expected_cash closing_count) 100)))'
    require_fields: [difference_reason]
    message: Pick a reason before closing.
  - type: predicate
    condition: '(> (count "opening_counts") 0)'
    predicate: '(== (round opening_float 2) (round (sum "opening_counts" "amount") 2))'
    message: Counted notes and coins don't add up to the total.
  - type: predicate
    condition: '(> (count "closing_counts") 0)'
    predicate: '(== (round closing_count 2) (round (sum "closing_counts" "amount") 2))'
    message: Counted notes and coins don't add up to the total.
