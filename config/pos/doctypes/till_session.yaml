name: Till Session
module_owner_id: pos.core
module_ownership_mode: commands_only
module_access: published
module: POS
title_field: shift
search_fields: shift
fields:
  - fieldname: shift
    fieldtype: Link
    options: Shift
    label: Shift
    reqd: true
    in_list_view: true
  - fieldname: opening_float
    fieldtype: Currency
    label: Opening Float
    reqd: true
    in_list_view: true
  - fieldname: closing_count
    fieldtype: Currency
    label: Closing Count
  - fieldname: expected_cash
    fieldtype: Currency
    label: Expected Cash
    read_only: true
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Open
      Closed
    default: Open
    in_list_view: true
  - fieldname: closed_at
    fieldtype: Datetime
    label: Closed At
  - fieldname: variance
    fieldtype: Currency
    label: Variance
    computed: "closing_count - expected_cash"
