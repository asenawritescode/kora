name: Till Session
module_owner_id: pos.core
module_ownership_mode: commands_only
module_access: published
module: POS
title_field: shift
search_fields: shift
fields:
  - fieldname: shift
    fieldtype: Link
    options: Shift
    label: Shift
    reqd: true
    search_index: true
    in_list_view: true
  - fieldname: register
    fieldtype: Link
    options: Register
    label: Register
    read_only: true
    search_index: true
    in_list_view: true
  - fieldname: location
    fieldtype: Link
    options: Location
    label: Location
    read_only: true
  - fieldname: cashier
    fieldtype: Data
    label: Cashier
    read_only: true
    search_index: true
  - fieldname: opening_float
    fieldtype: Currency
    label: Opening Float
    reqd: true
    in_list_view: true
  - fieldname: closing_count
    fieldtype: Currency
    label: Closing Count
  - fieldname: expected_cash
    fieldtype: Currency
    label: Expected Cash
    read_only: true
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Open
      Closed
    default: Open
    in_list_view: true
  - fieldname: closed_at
    fieldtype: Datetime
    label: Closed At
  - fieldname: variance
    fieldtype: Currency
    label: Variance
    computed: "closing_count - expected_cash"
  - fieldname: opening_note
    fieldtype: Data
    label: Opening Note
    description: Why the opening float differs from what the last till left in the drawer.
  - fieldname: cash_sale_count
    fieldtype: Int
    label: Cash Sale Count
    default: 0
    read_only: true
    description: Cash payments taken on this till, kept by record_sale and void_sale.
  - fieldname: cash_sale_total
    fieldtype: Currency
    label: Cash Sales
    default: 0
    read_only: true
  - fieldname: cash_refund_count
    fieldtype: Int
    label: Cash Refund Count
    default: 0
    read_only: true
    description: Cash refund payments paid out of this till, kept by return_sale.
  - fieldname: cash_refund_total
    fieldtype: Currency
    label: Cash Refunds
    default: 0
    read_only: true
  - fieldname: payout_count
    fieldtype: Int
    label: Pay-out Count
    default: 0
    read_only: true
    description: Cash taken out of the drawer. Stays 0 until cash movements land.
  - fieldname: payout_total
    fieldtype: Currency
    label: Pay-outs
    default: 0
    read_only: true
  - fieldname: payin_count
    fieldtype: Int
    label: Pay-in Count
    default: 0
    read_only: true
    description: Cash put into the drawer. Stays 0 until cash movements land.
  - fieldname: payin_total
    fieldtype: Currency
    label: Pay-ins
    default: 0
    read_only: true
