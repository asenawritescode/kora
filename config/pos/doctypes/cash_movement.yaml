name: Cash Movement
module_owner_id: pos.core
module_ownership_mode: commands_only
module_access: published
module: POS
title_field: reason
search_fields: reason, cashier
fields:
  - fieldname: till_session
    fieldtype: Link
    options: Till Session
    label: Till Session
    reqd: true
    search_index: true
    in_list_view: true
  - fieldname: direction
    fieldtype: Select
    label: Direction
    options: |
      In
      Out
    reqd: true
    in_list_view: true
  - fieldname: amount
    fieldtype: Currency
    label: Amount
    reqd: true
    in_list_view: true
  # Union of the pay-out and pay-in reason lists. record_pay_in and
  # record_pay_out narrow it per direction. "Change from bank" is the spelling
  # from before the board's "Change from the bank"; kept so stored rows stay valid.
  - fieldname: reason
    fieldtype: Select
    label: Reason
    options: |
      Stock purchase
      Transport
      Wages
      Owner took cash
      Other
      Change from the bank
      Owner added cash
      Change from bank
    reqd: true
    in_list_view: true
  - fieldname: note
    fieldtype: Data
    label: Note
  - fieldname: cashier
    fieldtype: User
    label: Cashier
    read_only: true
doc_constraints:
  - type: predicate
    predicate: '(if (== direction "Out") (<= amount 1000) 1)'
    message: Needs owner approval (coming soon)
