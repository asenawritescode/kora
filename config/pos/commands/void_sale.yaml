name: void_sale
namespace: pos
version: 1
module_owner_id: pos.core
capability: pos.checkout
operation: void_sale
presentation:
  title: Void sale
permission: write
input:
  record: Sale
require:
  - lock:
      record: Sale
      name: $input.sale
  - not_exists:
      record: Sale
      where:
        return_against: $input.sale
    message: A sale with returns cannot be voided
  - exists:
      record: Shift
      where:
        name: $input.shift
        status: Open
    message: Sale can only be voided while its shift is open
  - exists:
      record: Till Session
      where:
        name: $input.till_session
        shift: $input.shift
    message: Till does not belong to this shift
  - exists:
      record: Sale
      where:
        name: $input.sale
        till_session: $input.till_session
        register: $input.register
        status: Paid
    as: original
    message: Only a paid sale from this till can be voided
  - exists:
      record: Register
      where:
        name: $input.register
        location: $input.location
    message: Location does not belong to this register
transaction:
  - update:
      record: Sale
      name: $steps.original.name
      values:
        status: Void
  - for_each: $steps.original.items
    update:
      record: Stock Balance
      where:
        item: $item.item
        location: $input.location
      adjust:
        quantity: { increase: $item.quantity }
  - for_each: $steps.original.items
    create:
      record: Stock Entry
      values:
        item: $item.item
        location: $input.location
        quantity: $item.quantity
        entry_type: Receipt
        remarks: $steps.original.name
emit:
  - pos.sale.voided
