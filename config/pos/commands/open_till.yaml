# Tills opened this way record no cashier (kora#344), so only Owner, Manager and
# Administrator can sell, return, void or close on them (kora#358). Cashiers use open_session.
name: open_till
namespace: pos
version: 1
module_owner_id: pos.core
capability: pos.drawer
operation: open_till
presentation:
  title: Open till
permission: create
input:
  record: Till Session
require:
  - exists:
      record: Shift
      where:
        name: $input.shift
        status: Open
    message: Shift is not open
  - not_exists:
      record: Till Session
      where:
        shift: $input.shift
    message: Till already opened for this shift
transaction:
  - create:
      record: Till Session
      values:
        shift: $input.shift
        opening_float: $input.opening_float
        expected_cash: $input.opening_float
        status: Open
emit:
  - pos.till.opened
