# Holds the open sale under the number the till reserved for its session. A held
# sale takes no stock and no cash. At most 20 may be held per till session.
name: hold_sale
namespace: pos
version: 1
module_owner_id: pos.core
capability: pos.checkout
operation: hold_sale
offline_eligible: true
presentation:
  title: Hold sale
permission: create
input:
  record: Sale
  extra:
    sale_number: {type: string, required: true}
require:
  - lock:
      record: Till Session
      name: $input.till_session
  - count:
      record: Sale
      where:
        till_session: $input.till_session
        status: Held
      limit: 20
    message: 20 held sales is the most for one till. Recall or delete one first.
  - exists:
      record: Till Session
      where:
        name: $input.till_session
        status: Open
    message: Till is not open
  - exists:
      record: Till Session
      where:
        name: $input.till_session
        cashier: $actor
    unless_role: [Owner, Manager, Administrator]
    message: This till belongs to another cashier
  - not_exists:
      record: Sale
      where:
        name: $input.sale_number
    message: That sale number is already used
transaction:
  - create:
      record: Sale
      name: $input.sale_number
      in_block: $input.till_session
      values:
        register: $input.register
        location: $input.location
        till_session: $input.till_session
        customer: $input.customer
        items: $input.items
        held_name: $input.held_name
        held_at: $input.held_at
        held_by: $input.held_by
        status: Held
output:
  reference: $input.sale_number
