name: close_shift
namespace: pos
version: 1
module_owner_id: pos.core
capability: pos.drawer
operation: close_shift
presentation:
  title: Close shift
permission: write
input:
  record: Shift
require:
  - exists:
      record: Shift
      where:
        register: $input.register
        status: Open
    as: shift
    message: Register has no open shift
  - exists:
      record: Shift
      where:
        register: $input.register
        status: Open
        cashier: $actor
    unless_role: [Owner, Manager]
    message: This shift belongs to another cashier
transaction:
  - update:
      record: Shift
      name: $steps.shift.name
      values:
        status: Closed
        ended_at: $now
emit:
  - pos.shift.closed
