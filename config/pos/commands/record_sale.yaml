name: record_sale
namespace: pos
version: 1
module_owner_id: pos.core
capability: pos.checkout
operation: record_sale
offline_eligible: true
presentation:
  title: Record sale
  layout: line_entry
  line_entry: {lines_path: items, lookup_query: inventory.core~inventory.items~item_search, lookup_input: term, item_map: {item: name, unit_price: price}, quantity_field: quantity, amount_expr: "quantity * unit_price", total_output: total}
permission: create
input:
  record: Sale
require:
  - payment:
      for_each: $input.payments
      reference: $item.reference
      amount: $item.amount
      currency: $input.currency
  - exists:
      record: Till Session
      where:
        name: $input.till_session
        status: Open
    message: Till is not open
  - exists:
      record: Till Session
      where:
        name: $input.till_session
        cashier: $actor
    unless_role: [Owner, Manager, Administrator]
    message: This till belongs to another cashier
  - equal: [$computed.paid, $computed.total]
    message: Payments must add up to the sale total
compute:
  total: {sum: $input.items, expr: "quantity * unit_price"}
  paid: {sum: $input.payments, expr: "amount"}
transaction:
  - as: sale
    create:
      record: Sale
      values:
        register: $input.register
        location: $input.location
        till_session: $input.till_session
        customer: $input.customer
        items: $input.items
        payments: $input.payments
        status: Paid
  - for_each: $input.payments
    where: {method: Cash}
    update:
      record: Till Session
      name: $input.till_session
      adjust:
        expected_cash: { increase: $item.amount }
  - for_each: $input.items
    create:
      record: Sale Line Balance
      values:
        sale: $steps.sale.name
        item: $item.item
        unit_price: $item.unit_price
        sold_quantity: $item.quantity
        remaining_quantity: $item.quantity
  - for_each: $input.items
    update:
      record: Stock Balance
      where:
        item: $item.item
        location: $input.location
      adjust:
        quantity: { decrease: $item.quantity, min: "0" }
  - for_each: $input.items
    create:
      record: Stock Entry
      values:
        item: $item.item
        location: $input.location
        quantity: $item.quantity
        entry_type: Issue
        remarks: $steps.sale.name
output:
  reference: $steps.sale.name
  total: $computed.total
emit:
  - pos.sale.recorded
