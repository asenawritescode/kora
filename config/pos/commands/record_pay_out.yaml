name: record_pay_out
namespace: pos
version: 1
module_owner_id: pos.core
capability: pos.drawer
operation: record_pay_out
presentation:
  title: Pay out
permission: create
input:
  record: Cash Movement
  # The board's pay-out reasons (WS-Till pay-out). Narrows the Cash Movement reason
  # field for this operation only; the doctype keeps the union of both lists.
  # Pay-outs over the limit are refused by the Cash Movement doc constraint.
  enum:
    reason: [Stock purchase, Transport, Wages, Owner took cash, Other]
  extra:
    till_session: {type: string, required: true}
require:
  - lock:
      record: Till Session
      name: $input.till_session
  - exists:
      record: Till Session
      where:
        name: $input.till_session
        status: Open
        cashier: $actor
    message: Till is not open for you
transaction:
  - as: movement
    create:
      record: Cash Movement
      values:
        till_session: $input.till_session
        direction: "Out"
        amount: $input.amount
        reason: $input.reason
        note: $input.note
        cashier: $actor
  - update:
      record: Till Session
      name: $input.till_session
      adjust:
        expected_cash: { decrease: $input.amount, min: "0" }
        payout_count: { increase: "1" }
        payout_total: { increase: $input.amount }
output:
  reference: $steps.movement.name
