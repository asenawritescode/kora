name: Stock Adjustment
module: Products
title_field: reason
search_fields: product, reason
sort_field: creation
sort_order: DESC
description: Signed stock change with a recorded reason. Saving it changes the product stock in the same step, from any screen or the API.
append_only: true
quantity_effect:
  target_doctype: Product
  target_quantity_field: stock_qty
  source_record_field: product
  delta_field: delta
  reason_field: reason
fields:
  - fieldname: product
    fieldtype: Link
    options: Product
    label: Product
    reqd: true
    in_list_view: true
  - fieldname: delta
    fieldtype: Int
    label: Quantity change
    description: Positive to add stock, negative to remove stock.
    reqd: true
    in_list_view: true
  - fieldname: reason
    fieldtype: Text
    label: Reason
    reqd: true
    in_list_view: true
  - fieldname: adjusted_at
    fieldtype: Datetime
    label: Adjusted at
    default: now
    read_only: true
    hidden: true
    in_list_view: true
