name: sale_overview
label: Sales
route: /reports/sales
queries:
  - id: sales_by_day
    model: sale
    measures: [count, total_sum]
    dimensions: [sale_date]
  - id: sales_by_source
    model: sale
    measures: [count, total_sum]
    dimensions: [entry_source]
  - id: sales_by_status
    model: sale
    measures: [count, total_sum]
    dimensions: [status]
visuals:
  - id: sales_trend
    type: line
    source: sales_by_day
    x_field: sale_date
    series:
      - field: total_sum
        label: Sales
        type: line
        format: currency
  - id: sales_by_source
    type: bar
    source: sales_by_source
    x_field: entry_source
    series:
      - field: total_sum
        label: Sales
        type: bar
        format: currency
