name: Goods Receipt
module: Purchasing
append_only: true
quantity_effect:
  target_doctype: Product
  target_quantity_field: stock_qty
  lines_field: items
  source_record_field: product
  delta_field: quantity
  direction: increase
search_fields: reference, supplier
title_field: reference
sort_field: modified
sort_order: DESC
description: Goods that arrived from a supplier. Saving a receipt adds the received quantities to each product's stock in the same step. It cannot be edited afterwards; correct a mistake with a Stock Adjustment.

fields:
  - fieldname: reference
    fieldtype: Data
    label: Reference
    reqd: true
    unique: true
    in_list_view: true
  - fieldname: received_on
    fieldtype: Date
    label: Received on
    reqd: true
    in_list_view: true
    in_standard_filter: true
  - fieldname: supplier
    fieldtype: Link
    label: Supplier
    options: Supplier
    reqd: true
    in_list_view: true
  - fieldname: purchase_order
    fieldtype: Link
    label: Purchase order
    options: Purchase Order
    in_standard_filter: true
  - fieldname: currency
    fieldtype: Link
    label: Currency
    options: Currency
    description: Leave empty for the base currency.
    in_standard_filter: true
  - fieldname: exchange_rate
    fieldtype: Float
    label: Exchange rate
    description: Base currency per one unit of this currency, frozen when the record is made. 1 for the base currency.
    default: "1"
    linked_field: "currency.rate_to_base"
    constraints:
      - type: min
        value: 0.000001
        message: "The exchange rate must be more than zero."
  - fieldname: items
    fieldtype: Table
    label: Items
    options: Goods Receipt Item
    reqd: true
  - fieldname: total
    fieldtype: Currency
    label: Total
    computed: "SUM(items.line_total)"
    read_only: true
    in_list_view: true
  - fieldname: base_total
    fieldtype: Currency
    label: Total in base currency
    computed: "(round (* (round total 9) (round exchange_rate 9)) 2)"
    read_only: true
    in_list_view: true
  - fieldname: received_by
    fieldtype: User
    label: Received by
    read_only: true
  - fieldname: notes
    fieldtype: Text
    label: Notes
