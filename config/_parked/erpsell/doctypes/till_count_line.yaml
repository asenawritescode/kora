name: Till Count Line
module: Cash control
is_child_table: true
title_field: denomination
description: One denomination counted in a till drawer.

fields:
  - fieldname: denomination
    fieldtype: Currency
    label: Denomination
    reqd: true
    in_list_view: true
  - fieldname: quantity
    fieldtype: Int
    label: Count
    reqd: true
    in_list_view: true
  - fieldname: amount
    fieldtype: Currency
    label: Amount
    computed: "denomination * quantity"
    read_only: true
    in_list_view: true
