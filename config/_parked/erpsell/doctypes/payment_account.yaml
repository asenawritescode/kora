name: Payment Account
module: Selling
title_field: account_name
search_fields: account_name, number
description: Where non-cash payments are received, such as a till, paybill or bank account.

fields:
  - fieldname: account_name
    fieldtype: Data
    label: Account name
    reqd: true
    unique: true
    search_index: true
    in_list_view: true
  - fieldname: account_type
    fieldtype: Select
    label: Account type
    options: |
      Till
      Paybill
      Bank
      Other
    reqd: true
    in_list_view: true
  - fieldname: number
    fieldtype: Data
    label: Number
    description: Till, paybill or account number customers pay to.
    reqd: true
    in_list_view: true
  - fieldname: account_reference
    fieldtype: Data
    label: Account reference
    description: Optional paybill account number customers enter.
  - fieldname: currency
    fieldtype: Link
    options: Currency
    label: Currency
    description: Leave empty for the base currency.
  - fieldname: enabled
    fieldtype: Check
    label: Enabled
    default: "1"
    in_list_view: true
  - fieldname: register
    fieldtype: Link
    options: Register
    label: Register
    description: Optional. Leave empty for an account used on every register.
