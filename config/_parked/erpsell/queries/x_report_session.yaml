# X report header: the till session's register, opened_by and start time. The
# start is creation, written by open_session in the same transaction that sets
# the Shift's started_at.
name: x_report_session
module_owner_id: erpsell.core
capability: pos.till
operation: x_report_session
source: Till Session
permission: read
scope: tenant
owner_field: opened_by
input:
  till_session: {type: string, max_length: 140}
filters:
  - {field: name, op: eq, value: $input.till_session}
fields: [name, shift, register, opened_by, status, creation]
limit: 1
