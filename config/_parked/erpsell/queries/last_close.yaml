name: last_close
module_owner_id: erpsell.core
capability: pos.till
operation: last_close
source: Till Session
permission: read
scope: tenant
input:
  register: {type: string, max_length: 140}
filters:
  - {field: register, op: eq, value: $input.register}
  - {field: status, op: eq, value: Closed}
fields: [name, opened_by, closing_count, left_in_drawer, closed_at]
sort: [{field: closed_at, dir: desc}]
limit: 1
