name: void_sale
namespace: pos
version: 1
module_owner_id: erpsell.core
capability: pos.checkout
operation: void_sale
presentation:
  title: Void sale
permission: write
input:
  record: Sale
  extra:
    sale: {type: string, required: true}
    shift: {type: string, required: true}
require:
  - lock:
      record: Sale
      name: $input.sale
  - not_exists:
      record: Sale
      where:
        return_against: $input.sale
    message: A sale with returns cannot be voided
  - exists:
      record: Shift
      where:
        name: $input.shift
        status: Open
    message: Sale can only be voided while its shift is open
  - exists:
      record: Till Session
      where:
        name: $input.till_session
        shift: $input.shift
        status: Open
    message: Till does not belong to this shift
  - exists:
      record: Till Session
      where:
        name: $input.till_session
        opened_by: $actor
    unless_role: [Owner, Manager, Administrator]
    message: This till belongs to another cashier
  - exists:
      record: Sale
      where:
        name: $input.sale
        till_session: $input.till_session
        register: $input.register
        status: Paid
    as: original
    message: Only a paid sale from this till can be voided
  - exists:
      record: Register
      where:
        name: $input.register
        location: $input.location
    message: Location does not belong to this register
# Moving the sale from Paid to Void leaves the status-gated quantity effect,
# which puts its lines back into Product.stock_qty. No stock is written here.
transaction:
  - update:
      record: Sale
      name: $steps.original.name
      values:
        status: Void
  - for_each: $steps.original.payments
    where: {method: Cash}
    update:
      record: Till Session
      name: $input.till_session
      adjust:
        expected_cash: { decrease: $item.amount }
        cash_sale_count: { decrease: "1", min: "0" }
        cash_sale_total: { decrease: $item.amount, min: "0" }
emit:
  - pos.sale.voided
