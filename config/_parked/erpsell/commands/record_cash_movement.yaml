# Superseded by record_pay_in and record_pay_out, which give each direction its
# own reason list. Kept only so the existing Studio step works until Studio
# switches. It takes the movement type directly: "Cash in" or "Cash out".
name: record_cash_movement
namespace: pos
version: 1
module_owner_id: erpsell.core
capability: pos.drawer
operation: record_cash_movement
presentation:
  title: Cash in or out
permission: create
input:
  record: Cash Movement
  extra:
    till_session: {type: string, required: true}
    movement_type: {type: string, required: true}
require:
  - lock:
      record: Till Session
      name: $input.till_session
  - exists:
      record: Till Session
      where:
        name: $input.till_session
        status: Open
        opened_by: $actor
    message: Till is not open for you
transaction:
  - as: movement
    create:
      record: Cash Movement
      values:
        till_session: $input.till_session
        movement_type: $input.movement_type
        amount: $input.amount
        reason: $input.reason
        note: $input.note
        created_by: $actor
  - update:
      record: Till Session
      name: $input.till_session
      adjust:
        expected_cash: { by: $input.amount, sign_from: $input.movement_type, increase_when: "Cash in", decrease_when: "Cash out", min: "0" }
        payin_count: { by: "1", sign_from: $input.movement_type, increase_when: "Cash in" }
        payin_total: { by: $input.amount, sign_from: $input.movement_type, increase_when: "Cash in" }
        payout_count: { by: "1", sign_from: $input.movement_type, increase_when: "Cash out" }
        payout_total: { by: $input.amount, sign_from: $input.movement_type, increase_when: "Cash out" }
output:
  reference: $steps.movement.name
