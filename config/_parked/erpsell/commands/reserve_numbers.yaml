# Reserves a block of sale numbers for an open till session, so the till can
# assign numbers while offline. The block never spans two year prefixes.
name: reserve_numbers
namespace: pos
version: 1
module_owner_id: erpsell.core
capability: pos.checkout
operation: reserve_numbers
presentation:
  title: Reserve sale numbers
permission: create
input:
  record: Till Session
  extra:
    till_session: {type: string, required: true}
require:
  - exists:
      record: Till Session
      where:
        name: $input.till_session
        status: Open
    message: Till is not open
  - exists:
      record: Till Session
      where:
        name: $input.till_session
        opened_by: $actor
    unless_role: [Owner, Manager, Administrator]
    message: This till belongs to another cashier
transaction:
  - as: block
    reserve: {record: Sale, owner: $input.till_session, size: 50}
output:
  reference: $steps.block.name
