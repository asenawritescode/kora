name: record_sale
namespace: pos
version: 1
module_owner_id: erpsell.core
capability: pos.checkout
operation: record_sale
offline_eligible: true
presentation:
  title: Record sale
  layout: line_entry
  line_entry: {lines_path: items, lookup_query: erpsell.core~inventory.items~item_search, lookup_input: term, item_map: {product: name, unit_price: selling_price}, quantity_field: quantity, amount_expr: "quantity * unit_price", total_output: total}
permission: create
input:
  record: Sale
  extra:
    # The number the till reserved for this sale. A held sale with this number
    # is paid (Held to Paid); without one the sale takes the next series number.
    sale_number: {type: string}
require:
  # A sale with this number that is already Paid, Void or Return cannot be recorded again.
  - not_exists: {record: Sale, where: {name: $input.sale_number, status: Paid}, optional: true}
    message: That sale is already paid
  - not_exists: {record: Sale, where: {name: $input.sale_number, status: Void}, optional: true}
    message: That sale is already voided
  - not_exists: {record: Sale, where: {name: $input.sale_number, status: Return}, optional: true}
    message: That sale is already returned
  - payment:
      for_each: $input.payments
      reference: $item.reference
      amount: $item.amount
      currency: $input.currency
  - exists:
      record: Till Session
      where:
        name: $input.till_session
        status: Open
    message: Till is not open
  - exists:
      record: Till Session
      where:
        name: $input.till_session
        opened_by: $actor
    unless_role: [Owner, Manager, Administrator]
    message: This till belongs to another cashier
  - equal: [$computed.paid, $computed.total]
    message: Payments must add up to the sale total
compute:
  total: {sum: $input.items, expr: "quantity * unit_price"}
  paid: {sum: $input.payments, expr: "amount"}
# The sale is written as Paid. The Sale record's status-gated quantity effect
# moves Product.stock_qty for its lines, so this command writes no stock.
transaction:
  - as: sale
    upsert:
      record: Sale
      name: $input.sale_number
      in_block: $input.till_session
      values:
        register: $input.register
        location: $input.location
        till_session: $input.till_session
        customer: $input.customer
        items: $input.items
        payments: $input.payments
        status: Paid
  - for_each: $input.payments
    where: {method: Cash}
    update:
      record: Till Session
      name: $input.till_session
      adjust:
        expected_cash: { increase: $item.amount }
        cash_sale_count: { increase: "1" }
        cash_sale_total: { increase: $item.amount }
  - for_each: $input.items
    create:
      record: Sale Line Balance
      values:
        sale: $steps.sale.name
        product: $item.product
        unit_price: $item.unit_price
        sold_quantity: $item.quantity
        remaining_quantity: $item.quantity
output:
  reference: $steps.sale.name
  total: $computed.total
emit:
  - pos.sale.recorded
