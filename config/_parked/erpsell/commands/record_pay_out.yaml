name: record_pay_out
namespace: pos
version: 1
module_owner_id: erpsell.core
capability: pos.drawer
operation: record_pay_out
presentation:
  title: Pay out
permission: create
input:
  record: Cash Movement
  # The board's reason list is not enforced: Cash Movement.reason is free text (kept as
  # the existing field type), so the command cannot narrow it.
  extra:
    till_session: {type: string, required: true}
require:
  - lock:
      record: Till Session
      name: $input.till_session
  - exists:
      record: Till Session
      where:
        name: $input.till_session
        status: Open
        opened_by: $actor
    message: Till is not open for you
transaction:
  - as: movement
    create:
      record: Cash Movement
      values:
        till_session: $input.till_session
        movement_type: "Cash out"
        amount: $input.amount
        reason: $input.reason
        note: $input.note
        created_by: $actor
  - update:
      record: Till Session
      name: $input.till_session
      adjust:
        expected_cash: { decrease: $input.amount, min: "0" }
        payout_count: { increase: "1" }
        payout_total: { increase: $input.amount }
output:
  reference: $steps.movement.name
