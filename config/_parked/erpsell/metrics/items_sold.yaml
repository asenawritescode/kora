name: items_sold
label: Items sold
type: simple
model: Sale
measure:
  agg: sum
  field: quantity
filters:
  - field: status
    op: in
    value: [Awaiting Payment, Partially Paid, Paid]
time: business_date
good: up
format: number
description: Quantity of items on sales that are awaiting payment, part paid or paid.
verified: true
