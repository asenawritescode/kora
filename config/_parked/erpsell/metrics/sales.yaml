name: sales
label: Sales
type: simple
model: Sale
measure:
  agg: sum
  field: base_total
filters:
  - field: status
    op: in
    value: [Awaiting Payment, Partially Paid, Paid]
time: business_date
good: up
format: currency
description: Base-currency total of sales that are awaiting payment, part paid or paid.
verified: true
