name: menu_tables_insights
label: "Menu insights"
description: "Figures and charts that reproduce the menu overview report."
default_range: last_30_days
tiles:
  - metric: menu_kitchen_orders_count_new
  - metric: menu_kitchen_orders_count_preparing
  - metric: menu_kitchen_orders_count_served
  - metric: menu_kitchen_orders_count_cancelled
charts:
  - id: items_by_category
    title: "Menu items by category"
    kind: bar
    metrics: [menu_items_count]
    by: category
