name: Supplier Payment
module: Payables
is_submittable: true
search_fields: reference, supplier, status
title_field: reference
sort_field: modified
sort_order: DESC
description: Money paid to a supplier against a bill, in the currency you paid in.

fields:
  - fieldname: reference
    fieldtype: Data
    label: Reference
    default_to_name: true
    description: Leave blank to use this record's number.
    unique: true
    in_list_view: true
  - fieldname: payment_date
    fieldtype: Date
    label: Paid on
    reqd: true
    in_list_view: true
    in_standard_filter: true
  - fieldname: supplier
    fieldtype: Link
    label: Supplier
    options: Supplier
    reqd: true
    in_list_view: true
  - fieldname: supplier_bill
    fieldtype: Link
    label: Supplier bill
    description: "A one-bill shortcut: pays this bill up to what it still owes."
    options: Supplier Bill
    in_standard_filter: true
  - fieldname: method
    fieldtype: Select
    label: Method
    options: |
      Cash
      Bank Transfer
      Card
      Other
    default: "Cash"
    in_list_view: true
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Draft
      Paid
      Voided
    default: "Draft"
    in_list_view: true
    in_standard_filter: true
  - fieldname: currency
    fieldtype: Link
    label: Currency
    options: Currency
    description: Leave empty for the base currency.
    in_standard_filter: true
  - fieldname: exchange_rate
    fieldtype: Float
    label: Exchange rate
    description: Base currency per one unit of this currency, frozen when the record is made. 1 for the base currency.
    default: "1"
    linked_field: "currency.rate_to_base"
    constraints:
      - type: min
        value: 0.000001
        message: "The exchange rate must be more than zero."
  - fieldname: amount
    fieldtype: Currency
    label: Amount
    reqd: true
    in_list_view: true
    constraints:
      - type: min
        value: 0.000001
        message: "The amount must be more than zero."
  - fieldname: base_amount
    fieldtype: Currency
    label: Amount in base currency
    computed: "(round (* (round amount 9) (round exchange_rate 9)) 2)"
    read_only: true
    in_list_view: true
  - fieldname: allocations
    fieldtype: Table
    label: Bills paid
    options: Supplier Payment Allocation
    description: "Which of this supplier's bills the payment pays, and how much of each. Ask the person each time."
  - fieldname: unallocated_amount
    fieldtype: Currency
    label: Supplier credit
    read_only: true
    description: "Paid beyond the listed bills; kept as credit with the supplier."
  - fieldname: note
    fieldtype: Text
    label: Note
