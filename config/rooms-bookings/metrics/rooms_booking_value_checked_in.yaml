name: rooms_booking_value_checked_in
label: "Booking value: Checked in"
type: simple
model: "Booking"
measure:
  agg: sum
  field: total
filters:
  - field: status
    op: "="
    value: "Checked in"
time: business_date
format: currency
description: "Booking value: Checked in from the Booking records (sum)."
