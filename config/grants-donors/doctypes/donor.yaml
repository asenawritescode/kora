name: Donor
module: Grants
title_field: donor_name
search_fields: donor_name, contact_person, email
sort_field: modified
sort_order: DESC
description: A person or organisation that funds the work.

fields:
  - fieldname: donor_name
    fieldtype: Data
    label: Donor
    reqd: true
    unique: true
    in_list_view: true
    search_index: true
  - fieldname: donor_type
    fieldtype: Select
    label: Donor type
    options: |
      Individual
      Organisation
      Government
      Foundation
    in_list_view: true
    in_standard_filter: true
  - fieldname: contact_person
    fieldtype: Data
    label: Contact person
  - fieldname: email
    fieldtype: Data
    label: Email
  - fieldname: phone
    fieldtype: Data
    label: Phone
