name: cake_profit_and_loss
label: Cake profit and loss
route: /reports/cake-profit-and-loss
queries:
  - id: sales
    model: cake_order
    measures: [cake_order_sum_total_sales, cake_order_sum_estimated_gross_profit, cake_order_sum_balance_due, count]
    dimensions: [order_date]
  - id: expenses
    model: cake_expense
    measures: [cake_expense_sum_total_cost, count]
    dimensions: [expense_date]
derived:
  - name: net_profit
    label: Net profit
    formula: sales.cake_order_sum_total_sales - expenses.cake_expense_sum_total_cost
    format: currency
  - name: profit_margin
    label: Profit margin
    formula: if(sales.cake_order_sum_total_sales > 0, net_profit / sales.cake_order_sum_total_sales * 100, 0)
    format: percent
visuals:
  - id: pnl_trend
    type: combo
    source: sales
    x_field: order_date
    series:
      - field: cake_order_sum_total_sales
        label: Sales
        type: bar
        format: currency
      - field: cake_order_sum_estimated_gross_profit
        label: Estimated gross profit
        type: line
        format: currency
