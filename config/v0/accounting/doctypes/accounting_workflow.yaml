name: Journal Entry Workflow
document_type: Journal Entry
is_active: true
workflow_state_field: status

states:
  - state: Draft
    doc_status: 0
    allow_edit: Accountant, Accounting Administrator
    style: default
  - state: Submitted
    doc_status: 0
    allow_edit: Controller, Accounting Administrator
    style: info
  - state: Approved
    doc_status: 0
    allow_edit: Controller, Accounting Administrator
    style: success
  - state: Posted
    doc_status: 1
    allow_edit: ""
    style: success
  - state: Reversed
    doc_status: 2
    allow_edit: ""
    style: danger

transitions:
  - action: Submit
    from: Draft
    to: Submitted
    allowed: Accountant, Accounting Administrator
  - action: Approve
    from: Submitted
    to: Approved
    allowed: Controller, Accounting Administrator
  - action: Post
    from: Approved
    to: Posted
    allowed: Controller, Accounting Administrator
  - action: Reverse
    from: Posted
    to: Reversed
    allowed: Controller
