name: Usage Record
module: Subscription and Recurring Services
description: A measured usage event for metered subscription billing.
title_field: reference
search_fields: reference, metric, external_event_id, status
sort_field: recorded_at
sort_order: DESC

fields:
  - fieldname: reference
    fieldtype: Data
    label: Reference
    reqd: true
    unique: true
    in_list_view: true
  - fieldname: subscription
    fieldtype: Link
    options: Subscription
    label: Subscription
    reqd: true
    in_list_view: true
  - fieldname: entitlement
    fieldtype: Link
    options: Entitlement
    label: Entitlement
  - fieldname: metric
    fieldtype: Data
    label: Usage metric
    reqd: true
    in_list_view: true
  - fieldname: quantity
    fieldtype: Float
    label: Quantity
    reqd: true
    in_list_view: true
  - fieldname: unit
    fieldtype: Data
    label: Unit
    reqd: true
  - fieldname: period_start
    fieldtype: Datetime
    label: Period start
    reqd: true
  - fieldname: period_end
    fieldtype: Datetime
    label: Period end
    reqd: true
  - fieldname: recorded_at
    fieldtype: Datetime
    label: Recorded at
    reqd: true
  - fieldname: external_event_id
    fieldtype: Data
    label: External event ID
    unique: true
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Recorded
      Billed
      Rejected
    default: Recorded
    in_list_view: true
