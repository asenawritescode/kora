name: Subscription and Recurring Services Workflow
document_type: Subscription
is_active: true
workflow_state_field: status

states:
  - state: quoted
    doc_status: 0
    allow_edit: Subscription and Recurring Services Operator, Subscription and Recurring Services Administrator
    style: default
  - state: active
    doc_status: 0
    allow_edit: Subscription and Recurring Services Reviewer, Subscription and Recurring Services Administrator
    style: info
  - state: paused
    doc_status: 0
    allow_edit: Subscription and Recurring Services Reviewer, Subscription and Recurring Services Administrator
    style: info
  - state: past_due
    doc_status: 0
    allow_edit: Subscription and Recurring Services Reviewer, Subscription and Recurring Services Administrator
    style: info
  - state: cancelled
    doc_status: 0
    allow_edit: Subscription and Recurring Services Reviewer, Subscription and Recurring Services Administrator
    style: info
  - state: expired
    doc_status: 1
    allow_edit: Subscription and Recurring Services Reviewer, Subscription and Recurring Services Administrator
    style: success

transitions:
  - action: Advance
    from: quoted
    to: active
    allowed: Subscription and Recurring Services Operator, Subscription and Recurring Services Reviewer, Subscription and Recurring Services Administrator
  - action: Advance
    from: active
    to: paused
    allowed: Subscription and Recurring Services Operator, Subscription and Recurring Services Reviewer, Subscription and Recurring Services Administrator
  - action: Advance
    from: paused
    to: past_due
    allowed: Subscription and Recurring Services Operator, Subscription and Recurring Services Reviewer, Subscription and Recurring Services Administrator
  - action: Advance
    from: past_due
    to: cancelled
    allowed: Subscription and Recurring Services Operator, Subscription and Recurring Services Reviewer, Subscription and Recurring Services Administrator
  - action: Advance
    from: cancelled
    to: expired
    allowed: Subscription and Recurring Services Operator, Subscription and Recurring Services Reviewer, Subscription and Recurring Services Administrator
