name: Billing Schedule
module: Subscription and Recurring Services
description: One planned billing period for a subscription.
title_field: reference
search_fields: reference, status
sort_field: billing_date
sort_order: ASC

fields:
  - fieldname: source_record
    fieldtype: Data
    label: Source record
    reqd: true
    read_only: true
    description: Subscription record that produced this billing period.
  - fieldname: actor
    fieldtype: Data
    label: Generated by
    reqd: true
    read_only: true
    description: Service identity that created this billing period.
  - fieldname: reference
    fieldtype: Data
    label: Reference
    reqd: true
    unique: true
    in_list_view: true
    search_index: true
  - fieldname: subscription
    fieldtype: Link
    options: Subscription
    label: Subscription
    reqd: true
    in_list_view: true
  - fieldname: billing_date
    fieldtype: Date
    label: Billing date
    reqd: true
    in_list_view: true
  - fieldname: period_start
    fieldtype: Date
    label: Period start
    reqd: true
  - fieldname: period_end
    fieldtype: Date
    label: Period end
    reqd: true
  - fieldname: amount
    fieldtype: Currency
    label: Amount to bill
    reqd: true
    in_list_view: true
  - fieldname: currency
    fieldtype: Select
    label: Currency
    options: |
      KES
      USD
      EUR
      GBP
    default: KES
    reqd: true
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Scheduled
      Invoiced
      Skipped
      Cancelled
    default: Scheduled
    in_list_view: true
