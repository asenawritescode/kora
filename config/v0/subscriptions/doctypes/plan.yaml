name: Plan
module: Subscription and Recurring Services
description: A sellable recurring plan with its commercial billing terms.
title_field: plan_name
search_fields: plan_name, plan_code, status
sort_field: plan_name
sort_order: ASC

fields:
  - fieldname: reference
    fieldtype: Data
    label: Reference
    reqd: true
    unique: true
    in_list_view: true
  - fieldname: plan_code
    fieldtype: Data
    label: Plan code
    reqd: true
    unique: true
    in_list_view: true
    search_index: true
  - fieldname: plan_name
    fieldtype: Data
    label: Plan name
    reqd: true
    in_list_view: true
    search_index: true
  - fieldname: description
    fieldtype: Text
    label: Description
  - fieldname: billing_interval
    fieldtype: Select
    label: Billing interval
    options: |
      Weekly
      Monthly
      Quarterly
      Annually
    default: Monthly
    reqd: true
    in_list_view: true
  - fieldname: interval_count
    fieldtype: Int
    label: Interval count
    default: 1
    reqd: true
  - fieldname: unit_price
    fieldtype: Currency
    label: Unit price
    reqd: true
    in_list_view: true
  - fieldname: currency
    fieldtype: Select
    label: Currency
    options: |
      KES
      USD
      EUR
      GBP
    default: KES
    reqd: true
    in_list_view: true
  - fieldname: trial_days
    fieldtype: Int
    label: Trial days
    default: 0
  - fieldname: tax_rate
    fieldtype: Float
    label: Tax rate (%)
    default: 0
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Draft
      Active
      Retired
    default: Active
    in_list_view: true
