name: Subscription Line
module: Subscription and Recurring Services
description: An additional priced item attached to a subscription.
title_field: reference
search_fields: reference, description, status
sort_field: modified
sort_order: DESC

fields:
  - fieldname: reference
    fieldtype: Data
    label: Reference
    reqd: true
    unique: true
    in_list_view: true
  - fieldname: subscription
    fieldtype: Link
    options: Subscription
    label: Subscription
    reqd: true
    in_list_view: true
  - fieldname: description
    fieldtype: Data
    label: Description
    reqd: true
    in_list_view: true
  - fieldname: quantity
    fieldtype: Float
    label: Quantity
    default: 1
    reqd: true
  - fieldname: unit_price
    fieldtype: Currency
    label: Unit price
    reqd: true
  - fieldname: amount
    fieldtype: Currency
    label: Line amount
    reqd: true
    in_list_view: true
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Active
      Cancelled
    default: Active
    in_list_view: true
