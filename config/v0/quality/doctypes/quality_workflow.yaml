name: Quality Management Workflow
document_type: Inspection Request
is_active: true
workflow_state_field: status

states:
  - state: scheduled
    doc_status: 0
    allow_edit: Quality Management Operator, Quality Management Administrator
    style: default
  - state: in_progress
    doc_status: 0
    allow_edit: Quality Management Reviewer, Quality Management Administrator
    style: info
  - state: passed
    doc_status: 0
    allow_edit: Quality Management Reviewer, Quality Management Administrator
    style: info
  - state: failed
    doc_status: 0
    allow_edit: Quality Management Reviewer, Quality Management Administrator
    style: info
  - state: contained
    doc_status: 0
    allow_edit: Quality Management Reviewer, Quality Management Administrator
    style: info
  - state: closed
    doc_status: 1
    allow_edit: Quality Management Reviewer, Quality Management Administrator
    style: success

transitions:
  - action: Advance
    from: scheduled
    to: in_progress
    allowed: Quality Management Operator, Quality Management Reviewer, Quality Management Administrator
  - action: Advance
    from: in_progress
    to: passed
    allowed: Quality Management Operator, Quality Management Reviewer, Quality Management Administrator
  - action: Advance
    from: passed
    to: failed
    allowed: Quality Management Operator, Quality Management Reviewer, Quality Management Administrator
  - action: Advance
    from: failed
    to: contained
    allowed: Quality Management Operator, Quality Management Reviewer, Quality Management Administrator
  - action: Advance
    from: contained
    to: closed
    allowed: Quality Management Operator, Quality Management Reviewer, Quality Management Administrator
