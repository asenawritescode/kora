name: FAQ
module: Website
sort_field: sort_order
sort_order: ASC
title_field: question

public_access:
  enabled: true
  list: true
  read: true
  fields:
    - slug
    - question
    - answer
    - category
    - sort_order
  filters:
    - field: status
      op: equals
      value: published
  sort_field: sort_order
  sort_order: ASC
  max_limit: 100
  cache_max_age: 60

fields:
  - fieldname: slug
    fieldtype: Data
    label: Slug
    reqd: true
    unique: true

  - fieldname: question
    fieldtype: Data
    label: Question
    reqd: true
    in_list_view: true

  - fieldname: answer
    fieldtype: Text
    label: Answer
    reqd: true

  - fieldname: category
    fieldtype: Data
    label: Category
    in_standard_filter: true

  - fieldname: sort_order
    fieldtype: Int
    label: Sort Order
    default: "100"

  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      draft
      published
      archived
    default: draft
    in_standard_filter: true
