name: Marketing Page
module: Website
sort_field: modified
sort_order: DESC
title_field: title

public_access:
  enabled: true
  list: true
  read: true
  fields:
    - slug
    - title
    - description
    - seo_title
    - seo_description
    - sections_json
  filters:
    - field: status
      op: equals
      value: published
  sort_field: modified
  sort_order: DESC
  max_limit: 50
  cache_max_age: 60

fields:
  - fieldname: slug
    fieldtype: Data
    label: Slug
    reqd: true
    unique: true
    in_list_view: true
    search_index: true

  - fieldname: title
    fieldtype: Data
    label: Title
    reqd: true
    in_list_view: true

  - fieldname: description
    fieldtype: Text
    label: Description

  - fieldname: seo_title
    fieldtype: Data
    label: SEO Title

  - fieldname: seo_description
    fieldtype: Text
    label: SEO Description

  - fieldname: sections_json
    fieldtype: JSON
    label: Sections JSON

  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      draft
      published
      archived
    default: draft
    in_standard_filter: true

  - fieldname: internal_notes
    fieldtype: Text
    label: Internal Notes
