name: Comparison Page
module: Website
sort_field: modified
sort_order: DESC
title_field: title

public_access:
  enabled: true
  list: true
  read: true
  fields:
    - slug
    - title
    - description
    - body
    - competitor
    - seo_title
    - seo_description
  filters:
    - field: status
      op: equals
      value: published
  sort_field: modified
  sort_order: DESC
  max_limit: 50
  cache_max_age: 60

fields:
  - fieldname: slug
    fieldtype: Data
    label: Slug
    reqd: true
    unique: true

  - fieldname: title
    fieldtype: Data
    label: Title
    reqd: true

  - fieldname: description
    fieldtype: Text
    label: Description

  - fieldname: body
    fieldtype: Text
    label: Body

  - fieldname: competitor
    fieldtype: Data
    label: Competitor

  - fieldname: seo_title
    fieldtype: Data
    label: SEO Title

  - fieldname: seo_description
    fieldtype: Text
    label: SEO Description

  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      draft
      published
      archived
    default: draft
