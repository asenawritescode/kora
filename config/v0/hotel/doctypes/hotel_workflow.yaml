name: Hotel and Guest Operations Workflow
document_type: Reservation
is_active: true
workflow_state_field: status

states:
  - state: inquiry
    doc_status: 0
    allow_edit: Hotel and Guest Operations Operator, Hotel and Guest Operations Administrator
    style: default
  - state: held
    doc_status: 0
    allow_edit: Hotel and Guest Operations Reviewer, Hotel and Guest Operations Administrator
    style: info
  - state: confirmed
    doc_status: 0
    allow_edit: Hotel and Guest Operations Reviewer, Hotel and Guest Operations Administrator
    style: info
  - state: checked_in
    doc_status: 0
    allow_edit: Hotel and Guest Operations Reviewer, Hotel and Guest Operations Administrator
    style: info
  - state: checked_out
    doc_status: 0
    allow_edit: Hotel and Guest Operations Reviewer, Hotel and Guest Operations Administrator
    style: info
  - state: cancelled
    doc_status: 1
    allow_edit: Hotel and Guest Operations Reviewer, Hotel and Guest Operations Administrator
    style: success

transitions:
  - action: Advance
    from: inquiry
    to: held
    allowed: Hotel and Guest Operations Operator, Hotel and Guest Operations Reviewer, Hotel and Guest Operations Administrator
  - action: Advance
    from: held
    to: confirmed
    allowed: Hotel and Guest Operations Operator, Hotel and Guest Operations Reviewer, Hotel and Guest Operations Administrator
  - action: Advance
    from: confirmed
    to: checked_in
    allowed: Hotel and Guest Operations Operator, Hotel and Guest Operations Reviewer, Hotel and Guest Operations Administrator
  - action: Advance
    from: checked_in
    to: checked_out
    allowed: Hotel and Guest Operations Operator, Hotel and Guest Operations Reviewer, Hotel and Guest Operations Administrator
  - action: Advance
    from: checked_out
    to: cancelled
    allowed: Hotel and Guest Operations Operator, Hotel and Guest Operations Reviewer, Hotel and Guest Operations Administrator
