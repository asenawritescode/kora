name: Customer Success and Renewals Workflow
document_type: Success Plan
is_active: true
workflow_state_field: status

states:
  - state: onboarding
    doc_status: 0
    allow_edit: Customer Success and Renewals Operator, Customer Success and Renewals Administrator
    style: default
  - state: active
    doc_status: 0
    allow_edit: Customer Success and Renewals Reviewer, Customer Success and Renewals Administrator
    style: info
  - state: at_risk
    doc_status: 0
    allow_edit: Customer Success and Renewals Reviewer, Customer Success and Renewals Administrator
    style: info
  - state: renewal_due
    doc_status: 0
    allow_edit: Customer Success and Renewals Reviewer, Customer Success and Renewals Administrator
    style: info
  - state: renewed
    doc_status: 0
    allow_edit: Customer Success and Renewals Reviewer, Customer Success and Renewals Administrator
    style: info
  - state: churned
    doc_status: 1
    allow_edit: Customer Success and Renewals Reviewer, Customer Success and Renewals Administrator
    style: success

transitions:
  - action: Advance
    from: onboarding
    to: active
    allowed: Customer Success and Renewals Operator, Customer Success and Renewals Reviewer, Customer Success and Renewals Administrator
  - action: Advance
    from: active
    to: at_risk
    allowed: Customer Success and Renewals Operator, Customer Success and Renewals Reviewer, Customer Success and Renewals Administrator
  - action: Advance
    from: at_risk
    to: renewal_due
    allowed: Customer Success and Renewals Operator, Customer Success and Renewals Reviewer, Customer Success and Renewals Administrator
  - action: Advance
    from: renewal_due
    to: renewed
    allowed: Customer Success and Renewals Operator, Customer Success and Renewals Reviewer, Customer Success and Renewals Administrator
  - action: Advance
    from: renewed
    to: churned
    allowed: Customer Success and Renewals Operator, Customer Success and Renewals Reviewer, Customer Success and Renewals Administrator
