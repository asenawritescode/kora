name: Restaurant and Food Service Workflow
document_type: Food Order
is_active: true
workflow_state_field: status

states:
  - state: open
    doc_status: 0
    allow_edit: Restaurant and Food Service Operator, Restaurant and Food Service Administrator
    style: default
  - state: submitted
    doc_status: 0
    allow_edit: Restaurant and Food Service Reviewer, Restaurant and Food Service Administrator
    style: info
  - state: preparing
    doc_status: 0
    allow_edit: Restaurant and Food Service Reviewer, Restaurant and Food Service Administrator
    style: info
  - state: ready
    doc_status: 0
    allow_edit: Restaurant and Food Service Reviewer, Restaurant and Food Service Administrator
    style: info
  - state: served
    doc_status: 0
    allow_edit: Restaurant and Food Service Reviewer, Restaurant and Food Service Administrator
    style: info
  - state: paid
    doc_status: 0
    allow_edit: Restaurant and Food Service Reviewer, Restaurant and Food Service Administrator
    style: info
  - state: closed
    doc_status: 1
    allow_edit: Restaurant and Food Service Reviewer, Restaurant and Food Service Administrator
    style: success

transitions:
  - action: Advance
    from: open
    to: submitted
    allowed: Restaurant and Food Service Operator, Restaurant and Food Service Reviewer, Restaurant and Food Service Administrator
  - action: Advance
    from: submitted
    to: preparing
    allowed: Restaurant and Food Service Operator, Restaurant and Food Service Reviewer, Restaurant and Food Service Administrator
  - action: Advance
    from: preparing
    to: ready
    allowed: Restaurant and Food Service Operator, Restaurant and Food Service Reviewer, Restaurant and Food Service Administrator
  - action: Advance
    from: ready
    to: served
    allowed: Restaurant and Food Service Operator, Restaurant and Food Service Reviewer, Restaurant and Food Service Administrator
  - action: Advance
    from: served
    to: paid
    allowed: Restaurant and Food Service Operator, Restaurant and Food Service Reviewer, Restaurant and Food Service Administrator
  - action: Advance
    from: paid
    to: closed
    allowed: Restaurant and Food Service Operator, Restaurant and Food Service Reviewer, Restaurant and Food Service Administrator
