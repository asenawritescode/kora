name: Reward
module: Loyalty
title_field: reward_name
search_fields: reward_name
sort_field: points_required
sort_order: ASC
fields:
  - fieldname: reward_name
    fieldtype: Data
    label: Reward Name
    reqd: true
    bold: true
    in_list_view: true
  - fieldname: points_required
    fieldtype: Float
    label: Points Required
    reqd: true
    in_list_view: true
  - fieldname: discount_amount
    fieldtype: Currency
    label: Discount Amount
  - fieldname: discount_percent
    fieldtype: Percent
    label: Discount Percent
  - fieldname: is_active
    fieldtype: Check
    label: Active
    default: "1"
    in_list_view: true
