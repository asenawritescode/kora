name: Stock Move
module: Inventory
is_child_table: true
title_field: reference
fields:
  - fieldname: movement_type
    fieldtype: Select
    label: Movement Type
    options: |
      Opening Stock
      Purchase Receipt
      Sale Issue
      Transfer In
      Transfer Out
      Adjustment
      Return
    reqd: true
    in_list_view: true
  - fieldname: qty_change
    fieldtype: Float
    label: Quantity Change
    reqd: true
    in_list_view: true
  - fieldname: unit_cost
    fieldtype: Currency
    label: Unit Cost
  - fieldname: warehouse
    fieldtype: Link
    label: Warehouse
    options: Warehouse
  - fieldname: reference
    fieldtype: Data
    label: Reference
    in_list_view: true
  - fieldname: movement_date
    fieldtype: Date
    label: Movement Date
  - fieldname: notes
    fieldtype: Text
    label: Notes
