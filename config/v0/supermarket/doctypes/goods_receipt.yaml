name: Goods Receipt
module: Procurement
title_field: supplier
search_fields: supplier, purchase_order, receipt_number
sort_field: receipt_date
sort_order: DESC
fields:
  - fieldname: receipt_number
    fieldtype: Data
    label: Receipt Number
    unique: true
    in_list_view: true
  - fieldname: purchase_order
    fieldtype: Link
    label: Purchase Order
    options: Purchase Order
  - fieldname: supplier
    fieldtype: Link
    label: Supplier
    options: Supplier
    reqd: true
    in_list_view: true
  - fieldname: warehouse
    fieldtype: Link
    label: Warehouse
    options: Warehouse
    reqd: true
  - fieldname: receipt_date
    fieldtype: Date
    label: Receipt Date
    reqd: true
    in_list_view: true
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Draft
      Posted
      Cancelled
    default: Posted
    in_list_view: true
  - fieldname: total_amount
    fieldtype: Currency
    label: Total Amount
    computed: "SUM(items.line_total)"
    read_only: true
    in_list_view: true
  - fieldname: items
    fieldtype: Table
    label: Received Items
    options: Goods Receipt Item
  - fieldname: notes
    fieldtype: Text
    label: Notes
