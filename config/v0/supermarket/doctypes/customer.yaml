name: Customer
module: CRM
title_field: customer_name
search_fields: customer_name, phone, email, loyalty_id
sort_field: customer_name
sort_order: ASC
fields:
  - fieldname: customer_name
    fieldtype: Data
    label: Customer Name
    reqd: true
    bold: true
    in_list_view: true
    search_index: true
  - fieldname: phone
    fieldtype: Data
    label: Phone
    in_list_view: true
    search_index: true
  - fieldname: email
    fieldtype: Data
    label: Email
  - fieldname: loyalty_id
    fieldtype: Data
    label: Loyalty ID
    unique: true
    in_list_view: true
    search_index: true
  - fieldname: tier
    fieldtype: Select
    label: Loyalty Tier
    options: |
      Standard
      Silver
      Gold
      Platinum
    default: Standard
    in_standard_filter: true
  - fieldname: points_balance
    fieldtype: Float
    label: Points Balance
    default: "0"
    read_only: true
    in_list_view: true
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Active
      Inactive
      Blocked
    default: Active
    in_list_view: true
  - fieldname: notes
    fieldtype: Text
    label: Notes
