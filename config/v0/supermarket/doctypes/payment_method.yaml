name: Payment Method
module: Finance
title_field: method_name
search_fields: method_name, method_type
sort_field: method_name
sort_order: ASC
fields:
  - fieldname: method_name
    fieldtype: Data
    label: Method Name
    reqd: true
    bold: true
    in_list_view: true
  - fieldname: method_type
    fieldtype: Select
    label: Method Type
    options: |
      Cash
      Card
      Mpesa
      Bank
      Loyalty Points
    reqd: true
    in_list_view: true
  - fieldname: requires_confirmation
    fieldtype: Check
    label: Requires Confirmation
    default: "0"
  - fieldname: enabled
    fieldtype: Check
    label: Enabled
    default: "1"
    in_list_view: true
