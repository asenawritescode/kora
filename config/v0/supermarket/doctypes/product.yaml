name: Product
module: Inventory
title_field: product_name
search_fields: product_name, sku, barcode, category, brand
sort_field: product_name
sort_order: ASC
fields:
  - fieldname: product_name
    fieldtype: Data
    label: Product Name
    reqd: true
    bold: true
    in_list_view: true
    search_index: true
  - fieldname: sku
    fieldtype: Data
    label: SKU
    reqd: true
    unique: true
    in_list_view: true
    search_index: true
  - fieldname: barcode
    fieldtype: Data
    label: Barcode
    unique: true
    in_list_view: true
    search_index: true
  - fieldname: brand
    fieldtype: Data
    label: Brand
    in_list_view: true
  - fieldname: category
    fieldtype: Select
    label: Category
    options: |
      Fresh Produce
      Bakery
      Dairy
      Meat & Deli
      Frozen Foods
      Beverages
      Snacks & Confectionery
      Household
      Toiletries
      Baby Care
      Pet Care
      Pharmacy
      General Merchandise
    reqd: true
    in_standard_filter: true
    in_list_view: true
  - fieldname: unit
    fieldtype: Select
    label: Unit
    options: |
      Piece
      Kg
      Liter
      Pack
      Box
      Carton
    default: Piece
  - fieldname: selling_price
    fieldtype: Currency
    label: Selling Price
    reqd: true
    in_list_view: true
  - fieldname: cost_price
    fieldtype: Currency
    label: Cost Price
  - fieldname: tax_rate
    fieldtype: Percent
    label: Tax Rate
    default: "16"
  - fieldname: supplier
    fieldtype: Link
    label: Preferred Supplier
    options: Supplier
  - fieldname: default_warehouse
    fieldtype: Link
    label: Default Warehouse
    options: Warehouse
  - fieldname: reorder_level
    fieldtype: Float
    label: Reorder Level
    default: "10"
  - fieldname: reorder_qty
    fieldtype: Float
    label: Reorder Quantity
    default: "24"
  - fieldname: is_active
    fieldtype: Check
    label: Active
    default: "1"
    in_standard_filter: true
  - fieldname: age_restricted
    fieldtype: Check
    label: Age Restricted
    default: "0"
  - fieldname: stock_qty
    fieldtype: Float
    label: Current Stock
    computed: "SUM(stock_moves.qty_change)"
    read_only: true
    in_list_view: true
  - fieldname: stock_moves
    fieldtype: Table
    label: Stock Movements
    options: Stock Move
