name: Supplier
module: Procurement
title_field: supplier_name
search_fields: supplier_name, contact_person, phone, email
sort_field: supplier_name
sort_order: ASC
fields:
  - fieldname: supplier_name
    fieldtype: Data
    label: Supplier Name
    reqd: true
    bold: true
    in_list_view: true
    search_index: true
  - fieldname: category
    fieldtype: Select
    label: Category
    options: |
      Fresh Produce
      Bakery
      Dairy
      Meat & Deli
      Beverages
      Household
      Toiletries
      General Merchandise
      Services
    in_list_view: true
    in_standard_filter: true
  - fieldname: contact_person
    fieldtype: Data
    label: Contact Person
  - fieldname: phone
    fieldtype: Data
    label: Phone
    in_list_view: true
  - fieldname: email
    fieldtype: Data
    label: Email
  - fieldname: address
    fieldtype: Text
    label: Address
  - fieldname: payment_terms
    fieldtype: Data
    label: Payment Terms
    default: Net 30
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Active
      Inactive
      Blacklisted
    default: Active
    in_list_view: true
