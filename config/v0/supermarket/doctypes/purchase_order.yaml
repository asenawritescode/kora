name: Purchase Order
module: Procurement
title_field: supplier
search_fields: supplier, status
sort_field: order_date
sort_order: DESC
is_submittable: true
fields:
  - fieldname: supplier
    fieldtype: Link
    label: Supplier
    options: Supplier
    reqd: true
    in_list_view: true
  - fieldname: order_date
    fieldtype: Date
    label: Order Date
    reqd: true
    in_list_view: true
  - fieldname: expected_date
    fieldtype: Date
    label: Expected Delivery
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Draft
      Ordered
      Partially Received
      Received
      Cancelled
    default: Draft
    in_list_view: true
    in_standard_filter: true
  - fieldname: total_amount
    fieldtype: Currency
    label: Total Amount
    computed: "SUM(items.line_total)"
    read_only: true
    in_list_view: true
  - fieldname: items
    fieldtype: Table
    label: Items
    options: Purchase Order Item
  - fieldname: notes
    fieldtype: Text
    label: Notes
