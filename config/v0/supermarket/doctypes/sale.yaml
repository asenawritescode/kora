name: Sale
module: Sales
title_field: customer_name
search_fields: customer_name, receipt_number, payment_method
sort_field: creation
sort_order: DESC
is_submittable: true
fields:
  - fieldname: receipt_number
    fieldtype: Data
    label: Receipt Number
    unique: true
    in_list_view: true
  - fieldname: customer
    fieldtype: Link
    label: Customer
    options: Customer
  - fieldname: customer_name
    fieldtype: Data
    label: Customer Name
    reqd: true
    default: Walk-in Customer
    bold: true
    in_list_view: true
    search_index: true
  - fieldname: customer_phone
    fieldtype: Data
    label: Customer Phone
    options: Phone
    in_list_view: true
  - fieldname: cashier
    fieldtype: Data
    label: Cashier
  - fieldname: payment_status
    fieldtype: Select
    label: Payment Status
    options: |
      Pending
      Paid
      Failed
      Cancelled
    default: Pending
    in_list_view: true
    in_standard_filter: true
  - fieldname: payment_method
    fieldtype: Select
    label: Payment Method
    options: |
      Cash
      Card
      Mobile Money
      Mpesa
      Loyalty Points
    default: Cash
    in_list_view: true
    in_standard_filter: true
  - fieldname: payment_provider
    fieldtype: Data
    label: Payment Provider
  - fieldname: external_operation
    fieldtype: Link
    label: External Operation
    options: External Operation
    in_list_view: true
  - fieldname: payment_reference
    fieldtype: Data
    label: Payment Reference
    in_list_view: true
  - fieldname: payment_request_id
    fieldtype: Data
    label: Provider Request ID
  - fieldname: payment_response
    fieldtype: JSON
    label: Provider Response
  - fieldname: subtotal
    fieldtype: Currency
    label: Subtotal
    computed: "SUM(items.line_total)"
    read_only: true
  - fieldname: discount_amount
    fieldtype: Currency
    label: Discount Amount
    default: "0"
  - fieldname: points_redeemed
    fieldtype: Float
    label: Points Redeemed
    default: "0"
  - fieldname: total_amount
    fieldtype: Currency
    label: Total Amount
    computed: subtotal - discount_amount
    read_only: true
    in_list_view: true
  - fieldname: items
    fieldtype: Table
    label: Sale Items
    options: Sale Item
  - fieldname: notes
    fieldtype: Text
    label: Notes
