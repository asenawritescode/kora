name: External Operation
module: Integrations
title_field: purpose
search_fields: purpose, source_name, provider, provider_reference, idempotency_key
sort_field: creation
sort_order: DESC
fields:
  - fieldname: operation_type
    fieldtype: Select
    label: Operation Type
    options: |
      Payment
      Shipment
      Booking
      KYC
      Tax Submission
      Notification
      Other
    reqd: true
    in_list_view: true
    in_standard_filter: true
  - fieldname: purpose
    fieldtype: Data
    label: Purpose
    reqd: true
    in_list_view: true
    search_index: true
  - fieldname: source_doctype
    fieldtype: Data
    label: Source DocType
    reqd: true
    in_list_view: true
  - fieldname: source_name
    fieldtype: Data
    label: Source Record
    in_list_view: true
  - fieldname: provider
    fieldtype: Data
    label: Provider
    reqd: true
    in_list_view: true
    in_standard_filter: true
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Created
      Initiating
      Pending
      Succeeded
      Failed
      Cancelled
      Expired
      Finalized
    default: Created
    reqd: true
    in_list_view: true
    in_standard_filter: true
  - fieldname: amount
    fieldtype: Currency
    label: Amount
    in_list_view: true
  - fieldname: currency
    fieldtype: Data
    label: Currency
    default: KES
  - fieldname: contact_reference
    fieldtype: Data
    label: Contact Reference
    in_list_view: true
  - fieldname: provider_reference
    fieldtype: Data
    label: Provider Reference
    in_list_view: true
    in_standard_filter: true
  - fieldname: provider_request_id
    fieldtype: Data
    label: Provider Request ID
    in_list_view: true
    description: Provider request identifier used to match asynchronous callbacks.
  - fieldname: idempotency_key
    fieldtype: Data
    label: Idempotency Key
    unique: true
    in_list_view: true
  - fieldname: request_payload
    fieldtype: JSON
    label: Request Payload
  - fieldname: response_payload
    fieldtype: JSON
    label: Response Payload
  - fieldname: callback_payload
    fieldtype: JSON
    label: Callback Payload
  - fieldname: error_message
    fieldtype: Text
    label: Error Message
  - fieldname: retry_count
    fieldtype: Int
    label: Retry Count
    default: "0"
  - fieldname: next_check_at
    fieldtype: Datetime
    label: Next Check At
  - fieldname: expires_at
    fieldtype: Datetime
    label: Expires At
  - fieldname: initiated_by
    fieldtype: Data
    label: Initiated By
  - fieldname: initiated_at
    fieldtype: Datetime
    label: Initiated At
  - fieldname: last_status_at
    fieldtype: Datetime
    label: Last Status At
  - fieldname: completed_at
    fieldtype: Datetime
    label: Completed At
  - fieldname: finalized_at
    fieldtype: Datetime
    label: Finalized At
