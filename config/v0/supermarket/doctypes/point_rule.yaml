name: Point Rule
module: Loyalty
title_field: rule_name
search_fields: rule_name, metric
sort_field: rule_name
sort_order: ASC
fields:
  - fieldname: rule_name
    fieldtype: Data
    label: Rule Name
    reqd: true
    bold: true
    in_list_view: true
  - fieldname: metric
    fieldtype: Select
    label: Metric
    options: |
      Sales Amount
      Visit Count
      Category Promotion
      Basket Bonus
    reqd: true
    in_list_view: true
  - fieldname: points_per_unit
    fieldtype: Float
    label: Points Per Unit
    default: "1"
  - fieldname: amount_per_unit
    fieldtype: Currency
    label: Amount Per Unit
    default: "100"
  - fieldname: min_amount
    fieldtype: Currency
    label: Minimum Amount
    default: "0"
  - fieldname: category_filter
    fieldtype: Data
    label: Category Filter
  - fieldname: is_active
    fieldtype: Check
    label: Active
    default: "1"
    in_list_view: true
