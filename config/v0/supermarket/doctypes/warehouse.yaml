name: Warehouse
module: Inventory
title_field: warehouse_name
search_fields: warehouse_name, location
sort_field: warehouse_name
sort_order: ASC
fields:
  - fieldname: warehouse_name
    fieldtype: Data
    label: Warehouse Name
    reqd: true
    bold: true
    in_list_view: true
    search_index: true
  - fieldname: location
    fieldtype: Data
    label: Location
    in_list_view: true
  - fieldname: warehouse_type
    fieldtype: Select
    label: Warehouse Type
    options: |
      Main Store
      Sales Floor
      Cold Room
      Receiving Bay
      Damaged Goods
    default: Main Store
    in_standard_filter: true
  - fieldname: manager_name
    fieldtype: Data
    label: Manager Name
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Active
      Inactive
    default: Active
    in_list_view: true
