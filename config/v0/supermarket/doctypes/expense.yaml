name: Expense
module: Finance
title_field: description
search_fields: description, category
sort_field: expense_date
sort_order: DESC
fields:
  - fieldname: description
    fieldtype: Data
    label: Description
    reqd: true
    bold: true
    in_list_view: true
  - fieldname: category
    fieldtype: Select
    label: Category
    options: |
      Rent
      Payroll
      Utilities
      Transport
      Maintenance
      Packaging
      Marketing
      Other
    in_list_view: true
    in_standard_filter: true
  - fieldname: amount
    fieldtype: Currency
    label: Amount
    reqd: true
    in_list_view: true
  - fieldname: expense_date
    fieldtype: Date
    label: Date
    reqd: true
    in_list_view: true
  - fieldname: payment_method
    fieldtype: Select
    label: Payment Method
    options: |
      Cash
      Card
      Mobile Money
      Bank Transfer
    in_list_view: true
  - fieldname: notes
    fieldtype: Text
    label: Notes
