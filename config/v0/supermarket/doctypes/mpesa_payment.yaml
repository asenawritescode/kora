name: MPesa Payment
module: Finance
title_field: sale
search_fields: sale, customer_phone, checkout_request_id, mpesa_receipt_number
sort_field: creation
sort_order: DESC
fields:
  - fieldname: operation
    fieldtype: Link
    label: External Operation
    options: External Operation
    in_list_view: true
  - fieldname: sale
    fieldtype: Link
    label: Sale
    options: Sale
    in_list_view: true
  - fieldname: provider
    fieldtype: Data
    label: Provider
    default: M-Pesa
    in_list_view: true
  - fieldname: currency
    fieldtype: Data
    label: Currency
    default: KES
  - fieldname: customer_phone
    fieldtype: Data
    label: Customer Phone
    in_list_view: true
  - fieldname: amount
    fieldtype: Currency
    label: Amount
    reqd: true
    in_list_view: true
  - fieldname: checkout_request_id
    fieldtype: Data
    label: Checkout Request ID
    unique: true
    in_list_view: true
  - fieldname: merchant_request_id
    fieldtype: Data
    label: Merchant Request ID
  - fieldname: mpesa_receipt_number
    fieldtype: Data
    label: MPesa Receipt Number
    in_list_view: true
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Pending
      Paid
      Failed
      Cancelled
    default: Pending
    in_list_view: true
    in_standard_filter: true
  - fieldname: initiated_at
    fieldtype: Datetime
    label: Initiated At
  - fieldname: completed_at
    fieldtype: Datetime
    label: Completed At
  - fieldname: raw_request_json
    fieldtype: JSON
    label: Raw Request JSON
  - fieldname: raw_callback_json
    fieldtype: JSON
    label: Raw Callback JSON
