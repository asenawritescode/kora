name: Goods Receipt Item
module: Procurement
is_child_table: true
title_field: product
fields:
  - fieldname: product
    fieldtype: Link
    label: Product
    options: Product
    reqd: true
    in_list_view: true
  - fieldname: accepted_qty
    fieldtype: Float
    label: Accepted Quantity
    reqd: true
    in_list_view: true
  - fieldname: rejected_qty
    fieldtype: Float
    label: Rejected Quantity
    default: "0"
  - fieldname: unit_cost
    fieldtype: Currency
    label: Unit Cost
    reqd: true
    in_list_view: true
  - fieldname: line_total
    fieldtype: Currency
    label: Line Total
    computed: accepted_qty * unit_cost
    read_only: true
