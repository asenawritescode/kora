name: Sales Dashboard
route: /dashboard
type: dashboard
layout: grid
label: Sales Dashboard
module: Sales
components:
  - id: grid
    type: dashboard_grid
    region: main
    position: 0
    label: Store KPIs
    components:
      - id: total_sales
        type: metric_card
        region: main
        position: 0
        source_doctype: Sale
        label: Sales
        bindings:
          fn: COUNT
          view: Sales Dashboard
      - id: products
        type: metric_card
        region: main
        position: 1
        source_doctype: Product
        label: Products
        bindings:
          fn: COUNT
          view: Sales Dashboard
      - id: customers
        type: metric_card
        region: main
        position: 2
        source_doctype: Customer
        label: Customers
        bindings:
          fn: COUNT
          view: Sales Dashboard
      - id: recent_sales
        type: recent_records
        region: main
        position: 3
        source_doctype: Sale
        label: Recent Sales
        bindings:
          title: customer_name
          date: creation
          limit: "10"
