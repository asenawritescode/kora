name: Payment Operations
route: /payment-operations
type: collection
layout: single
label: Payment Operations
module: Finance
components:
  - id: operations
    type: record_table
    region: main
    position: 0
    source_doctype: External Operation
    label: Payment Operations
    filters:
      - field: operation_type
        op: equals
        value: Payment
    desktop_columns: [name, purpose, provider, status, amount, provider_reference, source_name, creation]
    mobile_columns: [purpose, amount, status]
  - id: events
    type: record_table
    region: main
    position: 1
    source_doctype: External Operation Event
    label: Payment Event Audit
    desktop_columns: [name, operation, direction, event_type, new_status, processing_status, received_at]
    mobile_columns: [operation, event_type, new_status]
