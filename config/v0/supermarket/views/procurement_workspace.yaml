name: Procurement Workspace
route: /procurement
type: workspace
layout: two_panel
label: Procurement
module: Procurement
components:
  - id: purchase_orders
    type: record_table
    region: main
    position: 0
    source_doctype: Purchase Order
    label: Purchase Orders
    desktop_columns: [name, supplier, order_date, expected_date, status, total_amount]
    mobile_columns: [supplier, status, total_amount]
  - id: goods_receipts
    type: record_table
    region: side
    position: 0
    source_doctype: Goods Receipt
    label: Goods Receipts
    desktop_columns: [name, supplier, receipt_date, status, total_amount]
    mobile_columns: [supplier, status, total_amount]
