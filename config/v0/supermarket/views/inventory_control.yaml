name: Inventory Control
route: /inventory
type: workspace
layout: two_panel
label: Inventory Control
module: Inventory
components:
  - id: filters
    type: filter_bar
    region: main
    position: 0
    label: Filter inventory
  - id: product_table
    type: record_table
    region: main
    position: 1
    source_doctype: Product
    label: Products and Stock
    desktop_columns: [name, product_name, sku, barcode, category, stock_qty, reorder_level, selling_price]
    mobile_columns: [product_name, stock_qty, selling_price]
  - id: low_stock
    type: record_table
    region: side
    position: 0
    source_doctype: Product
    label: Low Stock Watch
    desktop_columns: [product_name, stock_qty, reorder_level]
    mobile_columns: [product_name, stock_qty, reorder_level]
