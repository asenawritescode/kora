name: Membership and Association Management Workflow
document_type: Membership Application
is_active: true
workflow_state_field: status

states:
  - state: applied
    doc_status: 0
    allow_edit: Membership and Association Management Operator, Membership and Association Management Administrator
    style: default
  - state: pending_review
    doc_status: 0
    allow_edit: Membership and Association Management Reviewer, Membership and Association Management Administrator
    style: info
  - state: active
    doc_status: 0
    allow_edit: Membership and Association Management Reviewer, Membership and Association Management Administrator
    style: info
  - state: grace
    doc_status: 0
    allow_edit: Membership and Association Management Reviewer, Membership and Association Management Administrator
    style: info
  - state: lapsed
    doc_status: 0
    allow_edit: Membership and Association Management Reviewer, Membership and Association Management Administrator
    style: info
  - state: renewed
    doc_status: 1
    allow_edit: Membership and Association Management Reviewer, Membership and Association Management Administrator
    style: success

transitions:
  - action: Advance
    from: applied
    to: pending_review
    allowed: Membership and Association Management Operator, Membership and Association Management Reviewer, Membership and Association Management Administrator
  - action: Advance
    from: pending_review
    to: active
    allowed: Membership and Association Management Operator, Membership and Association Management Reviewer, Membership and Association Management Administrator
  - action: Advance
    from: active
    to: grace
    allowed: Membership and Association Management Operator, Membership and Association Management Reviewer, Membership and Association Management Administrator
  - action: Advance
    from: grace
    to: lapsed
    allowed: Membership and Association Management Operator, Membership and Association Management Reviewer, Membership and Association Management Administrator
  - action: Advance
    from: lapsed
    to: renewed
    allowed: Membership and Association Management Operator, Membership and Association Management Reviewer, Membership and Association Management Administrator
