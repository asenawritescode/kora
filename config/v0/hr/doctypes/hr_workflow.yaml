name: Human Resources and Employee Lifecycle Workflow
document_type: Employee
is_active: true
workflow_state_field: status

states:
  - state: candidate
    doc_status: 0
    allow_edit: Human Resources and Employee Lifecycle Operator, Human Resources and Employee Lifecycle Administrator
    style: default
  - state: onboarding
    doc_status: 0
    allow_edit: Human Resources and Employee Lifecycle Reviewer, Human Resources and Employee Lifecycle Administrator
    style: info
  - state: active
    doc_status: 0
    allow_edit: Human Resources and Employee Lifecycle Reviewer, Human Resources and Employee Lifecycle Administrator
    style: info
  - state: offboarding
    doc_status: 0
    allow_edit: Human Resources and Employee Lifecycle Reviewer, Human Resources and Employee Lifecycle Administrator
    style: info
  - state: exited
    doc_status: 1
    allow_edit: Human Resources and Employee Lifecycle Reviewer, Human Resources and Employee Lifecycle Administrator
    style: success

transitions:
  - action: Advance
    from: candidate
    to: onboarding
    allowed: Human Resources and Employee Lifecycle Operator, Human Resources and Employee Lifecycle Reviewer, Human Resources and Employee Lifecycle Administrator
  - action: Advance
    from: onboarding
    to: active
    allowed: Human Resources and Employee Lifecycle Operator, Human Resources and Employee Lifecycle Reviewer, Human Resources and Employee Lifecycle Administrator
  - action: Advance
    from: active
    to: offboarding
    allowed: Human Resources and Employee Lifecycle Operator, Human Resources and Employee Lifecycle Reviewer, Human Resources and Employee Lifecycle Administrator
  - action: Advance
    from: offboarding
    to: exited
    allowed: Human Resources and Employee Lifecycle Operator, Human Resources and Employee Lifecycle Reviewer, Human Resources and Employee Lifecycle Administrator
