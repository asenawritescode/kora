pack: erp_kenya
seed_mode: demo
records:
  # ── Currencies ──
  - doctype: Currency
    currency_code: KES
    currency_name: Kenyan Shilling
    symbol: KSh
    exchange_rate: "1"
    is_base_currency: "1"
    enabled: "1"

  - doctype: Currency
    currency_code: USD
    currency_name: US Dollar
    symbol: $
    exchange_rate: "135"
    is_base_currency: "0"
    enabled: "1"

  # ── Tax Authority ──
  - doctype: Tax Authority
    authority_name: KRA
    country: Kenya
    description: Kenya Revenue Authority — the principal tax collection agency for the Government of Kenya.

  # ── Tax Categories ──
  - doctype: Tax Category
    category_name: VAT 16
    category_type: VAT
    description: Standard VAT at 16% applicable to most goods and services.
    is_default: "1"

  - doctype: Tax Category
    category_name: VAT 0
    category_type: VAT
    description: Zero-rated VAT for exports and exempt supplies (water supply, agricultural inputs).
    is_default: "0"

  - doctype: Tax Category
    category_name: WHT
    category_type: Withholding Tax
    description: Withholding tax on supplier payments, consultancy fees, and professional services.
    is_default: "0"

  # ── Tax Rates ──
  - doctype: Tax Rate
    tax_name: Standard VAT 16%
    tax_authority: KRA
    tax_category: VAT 16
    rate: "16"
    effective_from: "2024-01-01"
    is_active: "1"
    description: Kenya standard VAT rate per the VAT Act 2013.

  - doctype: Tax Rate
    tax_name: Zero-Rated VAT 0%
    tax_authority: KRA
    tax_category: VAT 0
    rate: "0"
    effective_from: "2024-01-01"
    is_active: "1"
    description: Zero-rated supplies including water services, agricultural inputs, and exports.

  - doctype: Tax Rate
    tax_name: WHT 5%
    tax_authority: KRA
    tax_category: WHT
    rate: "5"
    effective_from: "2024-01-01"
    is_active: "1"
    description: Withholding tax at 5% on supplier payments for goods and consultancy services.

  # ── Fiscal Period ──
  - doctype: Fiscal Period
    period_name: FY2024 Full Year
