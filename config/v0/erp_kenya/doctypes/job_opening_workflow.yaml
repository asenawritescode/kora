name: Job Opening Workflow
document_type: Job Opening
is_active: true
workflow_state_field: status

states:
  - state: Open
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Interviewing
    doc_status: 0
    allow_edit: 1
    style: info
  - state: Offer Extended
    doc_status: 0
    allow_edit: 1
    style: warning
  - state: Filled
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Cancelled
    doc_status: 2
    allow_edit: 0
    style: danger

transitions:
  - action: Start Interviews
    from: Open
    to: Interviewing
    allowed: HR Officer, HR Manager, Administrator
  - action: Extend Offer
    from: Interviewing
    to: Offer Extended
    allowed: HR Manager, Administrator
  - action: Fill
    from: Offer Extended
    to: Filled
    allowed: HR Manager, Administrator
  - action: Cancel
    from: Open
    to: Cancelled
    allowed: HR Manager, Administrator
