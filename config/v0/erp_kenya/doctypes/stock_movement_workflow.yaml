name: Stock Movement Workflow
document_type: Stock Movement
is_active: true
workflow_state_field: status

states:
  - state: Draft
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Confirmed
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Cancelled
    doc_status: 2
    allow_edit: 0
    style: danger

transitions:
  - action: Confirm
    from: Draft
    to: Confirmed
    allowed: Warehouse Operator, Inventory Manager, Administrator
  - action: Cancel
    from: Draft
    to: Cancelled
    allowed: Inventory Manager, Administrator
