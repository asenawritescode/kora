name: Customer
module: Sales
title_field: customer_name
search_fields: customer_name, phone, tax_id
sort_field: customer_name
sort_order: ASC
fields:
  - fieldname: customer_name
    fieldtype: Data
    label: Customer Name
    reqd: true
    bold: true
    in_list_view: true
    search_index: true
  - fieldname: customer_type
    fieldtype: Select
    label: Customer Type
    options: |
      Individual
      Corporate
      Government
    reqd: true
    in_list_view: true
    in_standard_filter: true
  - fieldname: email
    fieldtype: Data
    label: Email
    options: Email
  - fieldname: phone
    fieldtype: Data
    label: Phone
    options: Phone
    in_list_view: true
  - fieldname: mobile
    fieldtype: Data
    label: Mobile
    options: Phone
  - fieldname: tax_id
    fieldtype: Data
    label: KRA PIN
    description: Kenya Revenue Authority Personal Identification Number.
  - fieldname: credit_limit
    fieldtype: Currency
    label: Credit Limit (KES)
    constraints:
      - type: min
        value: 0
        message: "Credit limit cannot be negative."
  - fieldname: payment_terms
    fieldtype: Select
    label: Payment Terms
    options: |
      Net 30
      Net 60
      Net 90
      Immediate
      Custom
    default: Net 30
  - fieldname: currency
    fieldtype: Link
    label: Currency
    options: Currency
    default: KES
  - fieldname: billing_address
    fieldtype: Text
    label: Billing Address
  - fieldname: shipping_address
    fieldtype: Text
    label: Shipping Address
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Active
      Inactive
      Blocked
    default: Active
    in_list_view: true
    in_standard_filter: true
  - fieldname: notes
    fieldtype: Text
    label: Notes
