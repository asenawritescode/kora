name: Tax Category
module: Finance
title_field: category_name
sort_field: category_name
sort_order: ASC
fields:
  - fieldname: category_name
    fieldtype: Data
    label: Category Name
    reqd: true
    bold: true
    in_list_view: true
    search_index: true
  - fieldname: category_type
    fieldtype: Select
    label: Category Type
    options: |
      VAT
      Withholding Tax
      Excise
      Service Charge
      Other
    in_list_view: true
    in_standard_filter: true
  - fieldname: description
    fieldtype: Text
    label: Description
  - fieldname: is_default
    fieldtype: Check
    label: Is Default
    description: Default tax category applied when no specific category is selected.
