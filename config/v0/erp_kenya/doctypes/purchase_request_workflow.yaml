name: Purchase Request Workflow
document_type: Purchase Request
is_active: true
workflow_state_field: status

states:
  - state: Draft
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Submitted
    doc_status: 0
    allow_edit: 1
    style: info
  - state: Approved
    doc_status: 0
    allow_edit: 1
    style: warning
  - state: Rejected
    doc_status: 1
    allow_edit: 0
    style: danger
  - state: Ordered
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Cancelled
    doc_status: 2
    allow_edit: 0
    style: danger

transitions:
  - action: Submit
    from: Draft
    to: Submitted
    allowed: Procurement Officer, Purchase Manager, Administrator
  - action: Approve
    from: Submitted
    to: Approved
    allowed: Purchase Manager, Finance Manager, Administrator
    condition: "doc.estimated_total > 0"
  - action: Reject
    from: Submitted
    to: Rejected
    allowed: Purchase Manager, Administrator
  - action: Order
    from: Approved
    to: Ordered
    allowed: Procurement Officer, Administrator
  - action: Cancel
    from: Draft
    to: Cancelled
    allowed: Purchase Manager, Administrator
  - action: Cancel
    from: Submitted
    to: Cancelled
    allowed: Purchase Manager, Administrator
