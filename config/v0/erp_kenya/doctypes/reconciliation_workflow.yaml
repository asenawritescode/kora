name: Reconciliation Workflow
document_type: Reconciliation
is_active: true
workflow_state_field: status

states:
  - state: Draft
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Submitted
    doc_status: 0
    allow_edit: 1
    style: info
  - state: Reviewed
    doc_status: 0
    allow_edit: 1
    style: warning
  - state: Completed
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Cancelled
    doc_status: 2
    allow_edit: 0
    style: danger

transitions:
  - action: Submit
    from: Draft
    to: Submitted
    allowed: Accountant, Finance Manager, Administrator
  - action: Review
    from: Submitted
    to: Reviewed
    allowed: Finance Manager, Administrator
  - action: Complete
    from: Reviewed
    to: Completed
    allowed: Finance Manager, Administrator
  - action: Cancel
    from: Draft
    to: Cancelled
    allowed: Finance Manager, Administrator
