name: Purchase Order Workflow
document_type: Purchase Order
is_active: true
workflow_state_field: status

states:
  - state: Draft
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Ordered
    doc_status: 0
    allow_edit: 1
    style: info
  - state: Partially Received
    doc_status: 0
    allow_edit: 1
    style: warning
  - state: Received
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Cancelled
    doc_status: 2
    allow_edit: 0
    style: danger

transitions:
  - action: Order
    from: Draft
    to: Ordered
    allowed: Purchase Manager, Procurement Officer, Administrator
    require_fields:
      - expected_delivery
  - action: Receive Partial
    from: Ordered
    to: Partially Received
    allowed: Warehouse Operator, Inventory Manager, Administrator
  - action: Receive Full
    from: Ordered
    to: Received
    allowed: Warehouse Operator, Inventory Manager, Administrator
  - action: Receive Full
    from: Partially Received
    to: Received
    allowed: Warehouse Operator, Inventory Manager, Administrator
  - action: Cancel
    from: Draft
    to: Cancelled
    allowed: Purchase Manager, Administrator
