name: Deal Workflow
document_type: Deal
is_active: true
workflow_state_field: status

states:
  - state: Lead
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Qualified
    doc_status: 0
    allow_edit: 1
    style: info
  - state: Proposal
    doc_status: 0
    allow_edit: 1
    style: warning
  - state: Negotiation
    doc_status: 0
    allow_edit: 1
    style: warning
  - state: Closed Won
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Closed Lost
    doc_status: 1
    allow_edit: 0
    style: danger

transitions:
  - action: Qualify
    from: Lead
    to: Qualified
    allowed: Sales Rep, Sales Manager, Administrator
    condition: "len(items) > 0"
  - action: Create Proposal
    from: Qualified
    to: Proposal
    allowed: Sales Rep, Sales Manager, Administrator
    require_fields:
      - expected_close_date
  - action: Negotiate
    from: Proposal
    to: Negotiation
    allowed: Sales Rep, Sales Manager, Administrator
  - action: Close Won
    from: Negotiation
    to: Closed Won
    allowed: Sales Manager, Administrator
    condition: "doc.total > 0"
  - action: Close Lost
    from: Lead
    to: Closed Lost
    allowed: Sales Rep, Sales Manager, Administrator
  - action: Close Lost
    from: Qualified
    to: Closed Lost
    allowed: Sales Rep, Sales Manager, Administrator
  - action: Close Lost
    from: Proposal
    to: Closed Lost
    allowed: Sales Rep, Sales Manager, Administrator
  - action: Reopen
    from: Closed Lost
    to: Lead
    allowed: Sales Manager, Administrator
