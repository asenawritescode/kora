name: WHT Certificate Workflow
document_type: WHT Certificate
is_active: true
workflow_state_field: status

states:
  - state: Draft
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Issued
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Cancelled
    doc_status: 2
    allow_edit: 0
    style: danger

transitions:
  - action: Issue
    from: Draft
    to: Issued
    allowed: Accountant, Finance Manager, Administrator
  - action: Cancel
    from: Issued
    to: Cancelled
    allowed: Finance Manager, Administrator
