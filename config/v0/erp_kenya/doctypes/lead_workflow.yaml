name: Lead Workflow
document_type: Lead
is_active: true
workflow_state_field: status

states:
  - state: New
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Contacted
    doc_status: 0
    allow_edit: 1
    style: info
  - state: Qualified
    doc_status: 0
    allow_edit: 1
    style: warning
  - state: Unqualified
    doc_status: 1
    allow_edit: 0
    style: danger
  - state: Junk
    doc_status: 1
    allow_edit: 0
    style: danger
  - state: Converted
    doc_status: 1
    allow_edit: 0
    style: success

transitions:
  - action: Contact
    from: New
    to: Contacted
    allowed: Sales Rep, CRM Manager, Administrator
  - action: Qualify
    from: Contacted
    to: Qualified
    allowed: Sales Rep, CRM Manager, Administrator
  - action: Unqualify
    from: New
    to: Unqualified
    allowed: Sales Rep, CRM Manager, Administrator
  - action: Unqualify
    from: Contacted
    to: Unqualified
    allowed: Sales Rep, CRM Manager, Administrator
  - action: Mark Junk
    from: New
    to: Junk
    allowed: Sales Rep, CRM Manager, Administrator
  - action: Convert
    from: Qualified
    to: Converted
    allowed: CRM Manager, Administrator
