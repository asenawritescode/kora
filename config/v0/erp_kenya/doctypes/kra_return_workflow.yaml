name: KRA Return Workflow
document_type: KRA Return
is_active: true
workflow_state_field: status

states:
  - state: Draft
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Prepared
    doc_status: 0
    allow_edit: 1
    style: info
  - state: Submitted
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Accepted
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Rejected
    doc_status: 1
    allow_edit: 0
    style: danger

transitions:
  - action: Prepare
    from: Draft
    to: Prepared
    allowed: Accountant, Finance Manager, Administrator
  - action: Submit
    from: Prepared
    to: Submitted
    allowed: Finance Manager, Administrator
  - action: Accept
    from: Submitted
    to: Accepted
    allowed: Finance Manager, Administrator
  - action: Reject
    from: Prepared
    to: Rejected
    allowed: Finance Manager, Administrator
  - action: Reject
    from: Submitted
    to: Rejected
    allowed: Finance Manager, Administrator
  - action: Resubmit
    from: Rejected
    to: Prepared
    allowed: Accountant, Finance Manager, Administrator
