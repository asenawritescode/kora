name: Goods Receipt Workflow
document_type: Goods Receipt
is_active: true
workflow_state_field: status

states:
  - state: Draft
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Submitted
    doc_status: 0
    allow_edit: 1
    style: info
  - state: Accepted
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Rejected
    doc_status: 1
    allow_edit: 0
    style: danger
  - state: Cancelled
    doc_status: 2
    allow_edit: 0
    style: danger

transitions:
  - action: Submit
    from: Draft
    to: Submitted
    allowed: Warehouse Operator, Inventory Manager, Administrator
  - action: Accept
    from: Submitted
    to: Accepted
    allowed: Inventory Manager, Administrator
  - action: Reject
    from: Submitted
    to: Rejected
    allowed: Inventory Manager, Administrator
  - action: Cancel
    from: Draft
    to: Cancelled
    allowed: Inventory Manager, Administrator
