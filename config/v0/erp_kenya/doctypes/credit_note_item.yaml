name: Credit Note Item
module: Sales
is_child_table: true
title_field: item
sort_field: idx
sort_order: ASC
fields:
  - fieldname: item
    fieldtype: Link
    label: Item
    options: Item
    reqd: true
    in_list_view: true
  - fieldname: quantity
    fieldtype: Float
    label: Quantity
    reqd: true
    in_list_view: true
    constraints:
      - type: min
        value: 0.01
        message: "Quantity must be at least 0.01."
  - fieldname: unit_price
    fieldtype: Currency
    label: Unit Price (KES)
    reqd: true
    in_list_view: true
    constraints:
      - type: min
        value: 0
        message: "Unit price cannot be negative."
  - fieldname: line_total
    fieldtype: Currency
    label: Line Total (KES)
    computed: "quantity * unit_price"
    read_only: true
    in_list_view: true
    description: Auto-computed from quantity × unit price.
  - fieldname: warehouse
    fieldtype: Link
    label: Warehouse
    options: Warehouse
  - fieldname: reason
    fieldtype: Data
    label: Reason
    description: Specific reason for this line item credit.
