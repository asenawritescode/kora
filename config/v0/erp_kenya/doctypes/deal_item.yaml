name: Deal Item
module: CRM
is_child_table: true
title_field: item
sort_field: idx
sort_order: ASC

fields:
  - fieldname: item
    fieldtype: Link
    label: Item
    options: Item
    reqd: true
    bold: true

  - fieldname: description
    fieldtype: Data
    label: Description

  - fieldname: quantity
    fieldtype: Float
    label: Quantity
    reqd: true
    default: "1"
    constraints:
      - type: min
        value: 0.01
        message: "Quantity must be at least 0.01."

  - fieldname: unit_price
    fieldtype: Currency
    label: Unit Price
    reqd: true
    constraints:
      - type: min
        value: 0
        message: "Unit price cannot be negative."

  - fieldname: line_total
    fieldtype: Currency
    label: Line Total
    computed: "quantity * unit_price"
    read_only: true
