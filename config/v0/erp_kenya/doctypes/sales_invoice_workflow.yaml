name: Sales Invoice Workflow
document_type: Sales Invoice
is_active: true
workflow_state_field: status

states:
  - state: Draft
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Sent
    doc_status: 0
    allow_edit: 1
    style: info
  - state: Paid
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Overdue
    doc_status: 1
    allow_edit: 0
    style: danger
  - state: Cancelled
    doc_status: 2
    allow_edit: 0
    style: danger

transitions:
  - action: Send
    from: Draft
    to: Sent
    allowed: Sales Rep, Sales Manager, Accountant, Administrator
  - action: Pay
    from: Draft
    to: Paid
    allowed: Accountant, Finance Manager, Administrator
  - action: Pay
    from: Sent
    to: Paid
    allowed: Accountant, Finance Manager, Administrator
  - action: Mark Overdue
    from: Sent
    to: Overdue
    allowed: Accountant, Administrator
  - action: Cancel
    from: Draft
    to: Cancelled
    allowed: Sales Manager, Accountant, Administrator
