name: Budget Workflow
document_type: Budget
is_active: true
workflow_state_field: status

states:
  - state: Draft
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Submitted
    doc_status: 0
    allow_edit: 1
    style: info
  - state: Approved
    doc_status: 0
    allow_edit: 1
    style: warning
  - state: Active
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Closed
    doc_status: 1
    allow_edit: 0
    style: default
  - state: Cancelled
    doc_status: 2
    allow_edit: 0
    style: danger

transitions:
  - action: Submit
    from: Draft
    to: Submitted
    allowed: Accountant, Finance Manager, Administrator
  - action: Approve
    from: Submitted
    to: Approved
    allowed: Finance Manager, Administrator
  - action: Activate
    from: Approved
    to: Active
    allowed: Finance Manager, Administrator
  - action: Close
    from: Active
    to: Closed
    allowed: Finance Manager, Administrator
  - action: Cancel
    from: Draft
    to: Cancelled
    allowed: Finance Manager, Administrator
  - action: Cancel
    from: Submitted
    to: Cancelled
    allowed: Finance Manager, Administrator
