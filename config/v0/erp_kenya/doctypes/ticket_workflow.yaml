name: Ticket Workflow
document_type: Ticket
is_active: true
workflow_state_field: status

states:
  - state: Open
    doc_status: 0
    allow_edit: 1
    style: default
  - state: In Progress
    doc_status: 0
    allow_edit: 1
    style: info
  - state: Waiting
    doc_status: 0
    allow_edit: 1
    style: warning
  - state: Resolved
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Closed
    doc_status: 1
    allow_edit: 0
    style: default
  - state: Cancelled
    doc_status: 2
    allow_edit: 0
    style: danger

transitions:
  - action: Start Work
    from: Open
    to: In Progress
    allowed: Support Agent, CRM Manager, Administrator
  - action: Wait
    from: Open
    to: Waiting
    allowed: Support Agent, CRM Manager, Administrator
  - action: Wait
    from: In Progress
    to: Waiting
    allowed: Support Agent, CRM Manager, Administrator
  - action: Resume
    from: Waiting
    to: In Progress
    allowed: Support Agent, CRM Manager, Administrator
  - action: Resolve
    from: Open
    to: Resolved
    allowed: Support Agent, CRM Manager, Administrator
  - action: Resolve
    from: In Progress
    to: Resolved
    allowed: Support Agent, CRM Manager, Administrator
  - action: Resolve
    from: Waiting
    to: Resolved
    allowed: Support Agent, CRM Manager, Administrator
  - action: Close
    from: Resolved
    to: Closed
    allowed: CRM Manager, Administrator
  - action: Reopen
    from: Resolved
    to: Open
    allowed: Support Agent, CRM Manager, Administrator
  - action: Reopen
    from: Closed
    to: Open
    allowed: Support Agent, CRM Manager, Administrator
  - action: Cancel
    from: Open
    to: Cancelled
    allowed: CRM Manager, Administrator
