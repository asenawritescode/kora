name: Leave Application Workflow
document_type: Leave Application
is_active: true
workflow_state_field: status

states:
  - state: Draft
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Submitted
    doc_status: 0
    allow_edit: 1
    style: info
  - state: Approved
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Rejected
    doc_status: 1
    allow_edit: 0
    style: danger
  - state: Cancelled
    doc_status: 2
    allow_edit: 0
    style: danger

transitions:
  - action: Submit
    from: Draft
    to: Submitted
    allowed: Employee, HR Officer, HR Manager, Administrator
  - action: Approve
    from: Submitted
    to: Approved
    allowed: HR Manager, Administrator
  - action: Reject
    from: Submitted
    to: Rejected
    allowed: HR Manager, Administrator
  - action: Cancel
    from: Draft
    to: Cancelled
    allowed: Employee, HR Officer, HR Manager, Administrator
  - action: Cancel
    from: Submitted
    to: Cancelled
    allowed: Employee, HR Officer, HR Manager, Administrator
