name: Sales Invoice
module: Sales
is_submittable: true
track_changes: true
title_field: customer
search_fields: customer, invoice_date
sort_field: invoice_date
sort_order: DESC
fields:
  # --- Left Column ---
  - fieldname: col_left
    fieldtype: Column Break

  - fieldname: customer
    fieldtype: Link
    label: Customer
    options: Customer
    reqd: true
    in_list_view: true
    search_index: true

  - fieldname: invoice_date
    fieldtype: Date
    label: Invoice Date
    reqd: true
    in_list_view: true

  - fieldname: due_date
    fieldtype: Date
    label: Due Date
    reqd: true

  - fieldname: sales_order
    fieldtype: Link
    label: Sales Order
    options: Sales Order

  # --- Right Column ---
  - fieldname: col_right
    fieldtype: Column Break

  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Draft
      Submitted
      Paid
      Partially Paid
      Overdue
      Cancelled
    default: Draft
    read_only: true
    in_list_view: true
    in_standard_filter: true

  - fieldname: currency
    fieldtype: Link
    label: Currency
    options: Currency
    default: KES

  - fieldname: tax_category
    fieldtype: Link
    label: Tax Category
    options: Tax Category

  # --- Section: Invoice Items ---
  - fieldname: section_items
    fieldtype: Section Break
    label: Invoice Items

  - fieldname: items
    fieldtype: Table
    label: Items
    options: Invoice Item
    reqd: true
    constraints:
      - type: min_rows
        value: 1
        message: "At least one invoice item is required."

  # --- Section: Totals ---
  - fieldname: section_totals
    fieldtype: Section Break
    label: Totals

  - fieldname: subtotal
    fieldtype: Currency
    label: Subtotal (KES)
    computed: "SUM(items.line_total)"
    read_only: true
    description: Auto-computed sum of all line totals.

  - fieldname: discount_amount
    fieldtype: Currency
    label: Discount Amount (KES)
    default: "0"
    constraints:
      - type: min
        value: 0
        message: "Discount cannot be negative."

  - fieldname: tax_rate
    fieldtype: Percent
    label: VAT Rate (%)
    default: "16"
    description: Kenya standard VAT rate is 16%.

  - fieldname: tax_amount
    fieldtype: Currency
    label: Tax Amount (KES)
    computed: "ROUND((subtotal - discount_amount) * tax_rate / 100, 2)"
    read_only: true
    description: Auto-computed VAT amount.

  - fieldname: total
    fieldtype: Currency
    label: Total (KES)
    computed: "ROUND(subtotal - discount_amount + tax_amount, 2)"
    read_only: true
    description: Auto-computed invoice total.

  - fieldname: amount_paid
    fieldtype: Currency
    label: Amount Paid (KES)
    default: "0"
    read_only: true

  - fieldname: balance_due
    fieldtype: Currency
    label: Balance Due (KES)
    computed: "total - amount_paid"
    read_only: true
    description: Outstanding amount to be collected.

  # --- Section: Notes ---
  - fieldname: section_notes
    fieldtype: Section Break
    label: Notes

  - fieldname: terms
    fieldtype: Text
    label: Terms and Conditions

  - fieldname: notes
    fieldtype: Text
    label: Notes
