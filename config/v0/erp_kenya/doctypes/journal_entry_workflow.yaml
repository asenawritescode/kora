name: Journal Entry Workflow
document_type: Journal Entry
is_active: true
workflow_state_field: status

states:
  - state: Draft
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Submitted
    doc_status: 0
    allow_edit: 1
    style: info
  - state: Approved
    doc_status: 0
    allow_edit: 1
    style: warning
  - state: Posted
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Reversed
    doc_status: 1
    allow_edit: 0
    style: danger
  - state: Cancelled
    doc_status: 2
    allow_edit: 0
    style: danger

transitions:
  - action: Submit
    from: Draft
    to: Submitted
    allowed: Accountant, Finance Manager, Administrator
  - action: Approve
    from: Submitted
    to: Approved
    allowed: Finance Manager, Administrator
  - action: Post
    from: Approved
    to: Posted
    allowed: Finance Manager, Administrator
  - action: Reverse
    from: Posted
    to: Reversed
    allowed: Finance Manager, Administrator
  - action: Cancel
    from: Draft
    to: Cancelled
    allowed: Accountant, Finance Manager, Administrator
  - action: Cancel
    from: Submitted
    to: Cancelled
    allowed: Accountant, Finance Manager, Administrator
