name: Sales Order Item
module: Sales
is_child_table: true
title_field: item
sort_field: idx
sort_order: ASC

fields:
  - fieldname: item
    fieldtype: Link
    label: Item
    options: Item
    reqd: true
    in_list_view: true

  - fieldname: description
    fieldtype: Data
    label: Description

  - fieldname: quantity
    fieldtype: Float
    label: Quantity
    reqd: true
    default: "1"
    constraints:
      - type: min
        value: 0.01
        message: "Quantity must be at least 0.01."

  - fieldname: unit_price
    fieldtype: Currency
    label: Unit Price (KES)
    linked_field: "item.selling_price"
    reqd: true

  - fieldname: line_total
    fieldtype: Currency
    label: Line Total (KES)
    computed: "quantity * unit_price"
    read_only: true
    description: Auto-computed from quantity × unit price.

  - fieldname: warehouse
    fieldtype: Link
    label: Warehouse
    options: Warehouse

  - fieldname: delivered_qty
    fieldtype: Float
    label: Delivered Qty
    default: "0"
    read_only: true

  - fieldname: pending_qty
    fieldtype: Float
    label: Pending Qty
    computed: "quantity - delivered_qty"
    read_only: true
    description: Quantity still to be delivered.
