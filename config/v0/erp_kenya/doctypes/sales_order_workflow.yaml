name: Sales Order Workflow
document_type: Sales Order
is_active: true
workflow_state_field: status

states:
  - state: Draft
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Submitted
    doc_status: 0
    allow_edit: 1
    style: info
  - state: Confirmed
    doc_status: 0
    allow_edit: 1
    style: warning
  - state: Fulfilled
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Cancelled
    doc_status: 2
    allow_edit: 0
    style: danger

transitions:
  - action: Submit
    from: Draft
    to: Submitted
    allowed: Sales Rep, Sales Manager, Administrator
  - action: Confirm
    from: Submitted
    to: Confirmed
    allowed: Sales Manager, Inventory Manager, Administrator
    require_fields:
      - delivery_date
  - action: Fulfill
    from: Confirmed
    to: Fulfilled
    allowed: Warehouse Operator, Inventory Manager, Administrator
  - action: Cancel
    from: Draft
    to: Cancelled
    allowed: Sales Manager, Administrator
  - action: Cancel
    from: Submitted
    to: Cancelled
    allowed: Sales Manager, Administrator
  - action: Reopen
    from: Fulfilled
    to: Confirmed
    allowed: Sales Manager, Administrator
