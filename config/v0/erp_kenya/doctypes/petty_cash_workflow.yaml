name: Petty Cash Workflow
document_type: Petty Cash
is_active: true
workflow_state_field: status

states:
  - state: Draft
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Submitted
    doc_status: 0
    allow_edit: 1
    style: info
  - state: Approved
    doc_status: 0
    allow_edit: 1
    style: warning
  - state: Paid
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Cancelled
    doc_status: 2
    allow_edit: 0
    style: danger

transitions:
  - action: Submit
    from: Draft
    to: Submitted
    allowed: Accounts Clerk, Accountant, Administrator
  - action: Approve
    from: Submitted
    to: Approved
    allowed: Finance Manager, Administrator
  - action: Pay
    from: Approved
    to: Paid
    allowed: Accountant, Administrator
  - action: Cancel
    from: Draft
    to: Cancelled
    allowed: Accountant, Finance Manager, Administrator
