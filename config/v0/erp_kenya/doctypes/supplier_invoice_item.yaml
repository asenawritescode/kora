name: Supplier Invoice Item
module: Purchasing
is_child_table: true
title_field: item
sort_field: idx
sort_order: ASC
fields:
  - fieldname: item
    fieldtype: Link
    label: Item
    options: Item
    reqd: true
    in_list_view: true
  - fieldname: description
    fieldtype: Data
    label: Description
    in_list_view: true
  - fieldname: quantity
    fieldtype: Float
    label: Quantity
    reqd: true
    default: "1"
    in_list_view: true
    constraints:
      - type: min
        value: 0.01
        message: "Quantity must be at least 0.01."
  - fieldname: unit_price
    fieldtype: Currency
    label: Unit Price (KES)
    reqd: true
    in_list_view: true
    constraints:
      - type: min
        value: 0
        message: "Unit price cannot be negative."
  - fieldname: line_total
    fieldtype: Currency
    label: Line Total (KES)
    computed: "quantity * unit_price"
    read_only: true
    in_list_view: true
    description: Auto-computed from quantity × unit price.
  - fieldname: gl_account
    fieldtype: Link
    label: GL Account
    options: Account
    description: Expense or inventory account for this line item.
  - fieldname: cost_center
    fieldtype: Link
    label: Cost Center
    options: Cost Center
