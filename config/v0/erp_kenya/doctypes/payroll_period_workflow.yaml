name: Payroll Period Workflow
document_type: Payroll Period
is_active: true
workflow_state_field: status

states:
  - state: Draft
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Processing
    doc_status: 0
    allow_edit: 1
    style: info
  - state: Completed
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Closed
    doc_status: 1
    allow_edit: 0
    style: success

transitions:
  - action: Process
    from: Draft
    to: Processing
    allowed: HR Officer, HR Manager, Administrator
  - action: Complete
    from: Processing
    to: Completed
    allowed: HR Manager, Administrator
  - action: Close
    from: Completed
    to: Closed
    allowed: HR Manager, Finance Manager, Administrator
