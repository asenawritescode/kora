name: Opportunity Workflow
document_type: Opportunity
is_active: true
workflow_state_field: status

states:
  - state: Prospecting
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Qualification
    doc_status: 0
    allow_edit: 1
    style: info
  - state: Needs Analysis
    doc_status: 0
    allow_edit: 1
    style: info
  - state: Proposal
    doc_status: 0
    allow_edit: 1
    style: warning
  - state: Price Quote
    doc_status: 0
    allow_edit: 1
    style: warning
  - state: Negotiation
    doc_status: 0
    allow_edit: 1
    style: warning
  - state: Closed Won
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Closed Lost
    doc_status: 1
    allow_edit: 0
    style: danger

transitions:
  - action: Progress
    from: Prospecting
    to: Qualification
    allowed: Sales Rep, Sales Manager, CRM Manager, Administrator
  - action: Progress
    from: Qualification
    to: Needs Analysis
    allowed: Sales Rep, Sales Manager, CRM Manager, Administrator
  - action: Progress
    from: Needs Analysis
    to: Proposal
    allowed: Sales Rep, Sales Manager, CRM Manager, Administrator
  - action: Progress
    from: Proposal
    to: Price Quote
    allowed: Sales Rep, Sales Manager, CRM Manager, Administrator
  - action: Progress
    from: Price Quote
    to: Negotiation
    allowed: Sales Rep, Sales Manager, CRM Manager, Administrator
  - action: Close Won
    from: Negotiation
    to: Closed Won
    allowed: Sales Manager, CRM Manager, Administrator
  - action: Close Lost
    from: Prospecting
    to: Closed Lost
    allowed: Sales Rep, Sales Manager, CRM Manager, Administrator
  - action: Close Lost
    from: Qualification
    to: Closed Lost
    allowed: Sales Rep, Sales Manager, CRM Manager, Administrator
  - action: Close Lost
    from: Needs Analysis
    to: Closed Lost
    allowed: Sales Rep, Sales Manager, CRM Manager, Administrator
  - action: Close Lost
    from: Proposal
    to: Closed Lost
    allowed: Sales Rep, Sales Manager, CRM Manager, Administrator
  - action: Close Lost
    from: Price Quote
    to: Closed Lost
    allowed: Sales Rep, Sales Manager, CRM Manager, Administrator
  - action: Close Lost
    from: Negotiation
    to: Closed Lost
    allowed: Sales Manager, CRM Manager, Administrator
