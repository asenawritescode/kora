name: Depreciation Entry Workflow
document_type: Depreciation Entry
is_active: true
workflow_state_field: status

states:
  - state: Draft
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Posted
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Cancelled
    doc_status: 2
    allow_edit: 0
    style: danger

transitions:
  - action: Post
    from: Draft
    to: Posted
    allowed: Accountant, Finance Manager, Administrator
  - action: Cancel
    from: Draft
    to: Cancelled
    allowed: Finance Manager, Administrator
