name: Credit Note Workflow
document_type: Credit Note
is_active: true
workflow_state_field: status

states:
  - state: Draft
    doc_status: 0
    allow_edit: 1
    style: default
  - state: Submitted
    doc_status: 0
    allow_edit: 1
    style: info
  - state: Approved
    doc_status: 1
    allow_edit: 0
    style: success
  - state: Cancelled
    doc_status: 2
    allow_edit: 0
    style: danger

transitions:
  - action: Submit
    from: Draft
    to: Submitted
    allowed: Sales Rep, Sales Manager, Accountant, Administrator
  - action: Approve
    from: Submitted
    to: Approved
    allowed: Sales Manager, Finance Manager, Administrator
  - action: Cancel
    from: Draft
    to: Cancelled
    allowed: Sales Manager, Administrator
