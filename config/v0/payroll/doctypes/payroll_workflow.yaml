name: Payroll Inputs and Compliance Workflow
document_type: Payroll Period
is_active: true
workflow_state_field: status

states:
  - state: open
    doc_status: 0
    allow_edit: Payroll Inputs and Compliance Operator, Payroll Inputs and Compliance Administrator
    style: default
  - state: collecting
    doc_status: 0
    allow_edit: Payroll Inputs and Compliance Reviewer, Payroll Inputs and Compliance Administrator
    style: info
  - state: review
    doc_status: 0
    allow_edit: Payroll Inputs and Compliance Reviewer, Payroll Inputs and Compliance Administrator
    style: info
  - state: locked
    doc_status: 0
    allow_edit: Payroll Inputs and Compliance Reviewer, Payroll Inputs and Compliance Administrator
    style: info
  - state: submitted
    doc_status: 0
    allow_edit: Payroll Inputs and Compliance Reviewer, Payroll Inputs and Compliance Administrator
    style: info
  - state: reconciled
    doc_status: 0
    allow_edit: Payroll Inputs and Compliance Reviewer, Payroll Inputs and Compliance Administrator
    style: info
  - state: closed
    doc_status: 1
    allow_edit: Payroll Inputs and Compliance Reviewer, Payroll Inputs and Compliance Administrator
    style: success

transitions:
  - action: Advance
    from: open
    to: collecting
    allowed: Payroll Inputs and Compliance Operator, Payroll Inputs and Compliance Reviewer, Payroll Inputs and Compliance Administrator
  - action: Advance
    from: collecting
    to: review
    allowed: Payroll Inputs and Compliance Operator, Payroll Inputs and Compliance Reviewer, Payroll Inputs and Compliance Administrator
  - action: Advance
    from: review
    to: locked
    allowed: Payroll Inputs and Compliance Operator, Payroll Inputs and Compliance Reviewer, Payroll Inputs and Compliance Administrator
  - action: Advance
    from: locked
    to: submitted
    allowed: Payroll Inputs and Compliance Operator, Payroll Inputs and Compliance Reviewer, Payroll Inputs and Compliance Administrator
  - action: Advance
    from: submitted
    to: reconciled
    allowed: Payroll Inputs and Compliance Operator, Payroll Inputs and Compliance Reviewer, Payroll Inputs and Compliance Administrator
  - action: Advance
    from: reconciled
    to: closed
    allowed: Payroll Inputs and Compliance Operator, Payroll Inputs and Compliance Reviewer, Payroll Inputs and Compliance Administrator
