name: Maintenance and Asset Service Workflow
document_type: Maintenance Work Order
is_active: true
workflow_state_field: status

states:
  - state: due
    doc_status: 0
    allow_edit: Maintenance and Asset Service Operator, Maintenance and Asset Service Administrator
    style: default
  - state: scheduled
    doc_status: 0
    allow_edit: Maintenance and Asset Service Reviewer, Maintenance and Asset Service Administrator
    style: info
  - state: in_progress
    doc_status: 0
    allow_edit: Maintenance and Asset Service Reviewer, Maintenance and Asset Service Administrator
    style: info
  - state: awaiting_parts
    doc_status: 0
    allow_edit: Maintenance and Asset Service Reviewer, Maintenance and Asset Service Administrator
    style: info
  - state: testing
    doc_status: 0
    allow_edit: Maintenance and Asset Service Reviewer, Maintenance and Asset Service Administrator
    style: info
  - state: completed
    doc_status: 1
    allow_edit: Maintenance and Asset Service Reviewer, Maintenance and Asset Service Administrator
    style: success

transitions:
  - action: Advance
    from: due
    to: scheduled
    allowed: Maintenance and Asset Service Operator, Maintenance and Asset Service Reviewer, Maintenance and Asset Service Administrator
  - action: Advance
    from: scheduled
    to: in_progress
    allowed: Maintenance and Asset Service Operator, Maintenance and Asset Service Reviewer, Maintenance and Asset Service Administrator
  - action: Advance
    from: in_progress
    to: awaiting_parts
    allowed: Maintenance and Asset Service Operator, Maintenance and Asset Service Reviewer, Maintenance and Asset Service Administrator
  - action: Advance
    from: awaiting_parts
    to: testing
    allowed: Maintenance and Asset Service Operator, Maintenance and Asset Service Reviewer, Maintenance and Asset Service Administrator
  - action: Advance
    from: testing
    to: completed
    allowed: Maintenance and Asset Service Operator, Maintenance and Asset Service Reviewer, Maintenance and Asset Service Administrator
