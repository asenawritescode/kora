name: Document and Knowledge Management Workflow
document_type: Document
is_active: true
workflow_state_field: status

states:
  - state: draft
    doc_status: 0
    allow_edit: Document and Knowledge Management Operator, Document and Knowledge Management Administrator
    style: default
  - state: in_review
    doc_status: 0
    allow_edit: Document and Knowledge Management Reviewer, Document and Knowledge Management Administrator
    style: info
  - state: approved
    doc_status: 0
    allow_edit: Document and Knowledge Management Reviewer, Document and Knowledge Management Administrator
    style: info
  - state: published
    doc_status: 0
    allow_edit: Document and Knowledge Management Reviewer, Document and Knowledge Management Administrator
    style: info
  - state: superseded
    doc_status: 0
    allow_edit: Document and Knowledge Management Reviewer, Document and Knowledge Management Administrator
    style: info
  - state: archived
    doc_status: 1
    allow_edit: Document and Knowledge Management Reviewer, Document and Knowledge Management Administrator
    style: success

transitions:
  - action: Advance
    from: draft
    to: in_review
    allowed: Document and Knowledge Management Operator, Document and Knowledge Management Reviewer, Document and Knowledge Management Administrator
  - action: Advance
    from: in_review
    to: approved
    allowed: Document and Knowledge Management Operator, Document and Knowledge Management Reviewer, Document and Knowledge Management Administrator
  - action: Advance
    from: approved
    to: published
    allowed: Document and Knowledge Management Operator, Document and Knowledge Management Reviewer, Document and Knowledge Management Administrator
  - action: Advance
    from: published
    to: superseded
    allowed: Document and Knowledge Management Operator, Document and Knowledge Management Reviewer, Document and Knowledge Management Administrator
  - action: Advance
    from: superseded
    to: archived
    allowed: Document and Knowledge Management Operator, Document and Knowledge Management Reviewer, Document and Knowledge Management Administrator
