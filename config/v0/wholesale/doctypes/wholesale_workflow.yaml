name: Wholesale and Distribution Workflow
document_type: Distributor Order
is_active: true
workflow_state_field: status

states:
  - state: draft
    doc_status: 0
    allow_edit: Wholesale and Distribution Operator, Wholesale and Distribution Administrator
    style: default
  - state: approved
    doc_status: 0
    allow_edit: Wholesale and Distribution Reviewer, Wholesale and Distribution Administrator
    style: info
  - state: allocated
    doc_status: 0
    allow_edit: Wholesale and Distribution Reviewer, Wholesale and Distribution Administrator
    style: info
  - state: part_delivered
    doc_status: 0
    allow_edit: Wholesale and Distribution Reviewer, Wholesale and Distribution Administrator
    style: info
  - state: delivered
    doc_status: 0
    allow_edit: Wholesale and Distribution Reviewer, Wholesale and Distribution Administrator
    style: info
  - state: cancelled
    doc_status: 1
    allow_edit: Wholesale and Distribution Reviewer, Wholesale and Distribution Administrator
    style: success

transitions:
  - action: Advance
    from: draft
    to: approved
    allowed: Wholesale and Distribution Operator, Wholesale and Distribution Reviewer, Wholesale and Distribution Administrator
  - action: Advance
    from: approved
    to: allocated
    allowed: Wholesale and Distribution Operator, Wholesale and Distribution Reviewer, Wholesale and Distribution Administrator
  - action: Advance
    from: allocated
    to: part_delivered
    allowed: Wholesale and Distribution Operator, Wholesale and Distribution Reviewer, Wholesale and Distribution Administrator
  - action: Advance
    from: part_delivered
    to: delivered
    allowed: Wholesale and Distribution Operator, Wholesale and Distribution Reviewer, Wholesale and Distribution Administrator
  - action: Advance
    from: delivered
    to: cancelled
    allowed: Wholesale and Distribution Operator, Wholesale and Distribution Reviewer, Wholesale and Distribution Administrator
