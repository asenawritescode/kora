name: Agriculture and Farm Operations Workflow
document_type: Crop Plan
is_active: true
workflow_state_field: status

states:
  - state: draft
    doc_status: 0
    allow_edit: Agriculture and Farm Operations Operator, Agriculture and Farm Operations Administrator
    style: default
  - state: approved
    doc_status: 0
    allow_edit: Agriculture and Farm Operations Reviewer, Agriculture and Farm Operations Administrator
    style: info
  - state: active
    doc_status: 0
    allow_edit: Agriculture and Farm Operations Reviewer, Agriculture and Farm Operations Administrator
    style: info
  - state: harvested
    doc_status: 0
    allow_edit: Agriculture and Farm Operations Reviewer, Agriculture and Farm Operations Administrator
    style: info
  - state: closed
    doc_status: 1
    allow_edit: Agriculture and Farm Operations Reviewer, Agriculture and Farm Operations Administrator
    style: success

transitions:
  - action: Advance
    from: draft
    to: approved
    allowed: Agriculture and Farm Operations Operator, Agriculture and Farm Operations Reviewer, Agriculture and Farm Operations Administrator
  - action: Advance
    from: approved
    to: active
    allowed: Agriculture and Farm Operations Operator, Agriculture and Farm Operations Reviewer, Agriculture and Farm Operations Administrator
  - action: Advance
    from: active
    to: harvested
    allowed: Agriculture and Farm Operations Operator, Agriculture and Farm Operations Reviewer, Agriculture and Farm Operations Administrator
  - action: Advance
    from: harvested
    to: closed
    allowed: Agriculture and Farm Operations Operator, Agriculture and Farm Operations Reviewer, Agriculture and Farm Operations Administrator
