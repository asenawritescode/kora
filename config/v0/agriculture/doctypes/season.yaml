name: Season
module: Agriculture
description: A production season for a farm, with start and end dates.
title_field: season_name
search_fields: season_name, farm
sort_field: start_date
sort_order: DESC

fields:
  - fieldname: season_name
    fieldtype: Data
    label: Season name
    reqd: true
    in_list_view: true
    search_index: true
  - fieldname: farm
    fieldtype: Link
    label: Farm
    options: Farm
    reqd: true
    in_list_view: true
  - fieldname: start_date
    fieldtype: Date
    label: Start date
    reqd: true
  - fieldname: end_date
    fieldtype: Date
    label: End date
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Planning
      Active
      Complete
    default: Planning
    in_list_view: true
  - fieldname: notes
    fieldtype: Text
    label: Notes
