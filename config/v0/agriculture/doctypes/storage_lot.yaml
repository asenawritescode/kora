name: Storage Lot
module: Agriculture
description: A stored portion of a harvest batch with quantity and location.
title_field: lot_reference
search_fields: lot_reference, storage_location, status
sort_field: received_on
sort_order: DESC

fields:
  - fieldname: lot_reference
    fieldtype: Data
    label: Storage lot reference
    reqd: true
    unique: true
    in_list_view: true
  - fieldname: harvest_batch
    fieldtype: Link
    label: Harvest batch
    options: Harvest Batch
    reqd: true
    in_list_view: true
  - fieldname: storage_location
    fieldtype: Data
    label: Store, room, or location
    reqd: true
    in_list_view: true
  - fieldname: quantity
    fieldtype: Float
    label: Quantity stored
    reqd: true
  - fieldname: unit
    fieldtype: Data
    label: Unit
    reqd: true
  - fieldname: received_on
    fieldtype: Date
    label: Stored on
    reqd: true
  - fieldname: recorded_by
    fieldtype: User
    label: Recorded by
    reqd: true
  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      In storage
      Partly issued
      Depleted
      Rejected
    default: In storage
    in_list_view: true
  - fieldname: notes
    fieldtype: Text
    label: Notes
