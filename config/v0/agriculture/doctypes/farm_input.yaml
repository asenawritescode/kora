name: Farm Input
module: Agriculture
description: An input item name maintained by the farm for consistent application records.
title_field: input_name
search_fields: input_name, input_type
sort_field: input_name
sort_order: ASC

fields:
  - fieldname: input_name
    fieldtype: Data
    label: Input name
    reqd: true
    unique: true
    in_list_view: true
    search_index: true
  - fieldname: input_type
    fieldtype: Select
    label: Type
    options: |
      Seed or planting material
      Soil or crop input
      Crop protection product
      Water
      Other
    default: Other
    in_list_view: true
  - fieldname: usual_unit
    fieldtype: Data
    label: Usual unit
  - fieldname: active
    fieldtype: Check
    label: Available for new records
    default: "1"
  - fieldname: notes
    fieldtype: Text
    label: Notes
