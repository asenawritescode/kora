name: Field
module: Agriculture
description: A named plot or field that belongs to one farm.
title_field: field_name
search_fields: field_name, farm
sort_field: modified
sort_order: DESC

fields:
  - fieldname: field_name
    fieldtype: Data
    label: Field name
    reqd: true
    in_list_view: true
    search_index: true
  - fieldname: farm
    fieldtype: Link
    label: Farm
    options: Farm
    reqd: true
    in_list_view: true
  - fieldname: area
    fieldtype: Float
    label: Area
  - fieldname: area_unit
    fieldtype: Select
    label: Area unit
    options: |
      Acre
      Hectare
      Other
  - fieldname: soil_or_location_notes
    fieldtype: Text
    label: Field notes
  - fieldname: active
    fieldtype: Check
    label: In use
    default: "1"
    in_list_view: true
