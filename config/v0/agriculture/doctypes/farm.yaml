name: Farm
module: Agriculture
description: A farm or independently managed production site.
title_field: farm_name
search_fields: farm_name, location
sort_field: modified
sort_order: DESC

fields:
  - fieldname: farm_name
    fieldtype: Data
    label: Farm name
    reqd: true
    unique: true
    in_list_view: true
    search_index: true
  - fieldname: location
    fieldtype: Data
    label: Town or area
    reqd: true
    in_list_view: true
  - fieldname: production_type
    fieldtype: Select
    label: Production type
    options: |
      Crops
      Horticulture
      Livestock
      Mixed
      Other
    default: Crops
  - fieldname: farm_manager
    fieldtype: User
    label: Farm manager
    description: Select an existing workspace user; leave blank for an owner-operated farm.
  - fieldname: area
    fieldtype: Float
    label: Total area
  - fieldname: area_unit
    fieldtype: Select
    label: Area unit
    options: |
      Acre
      Hectare
      Other
  - fieldname: notes
    fieldtype: Text
    label: Notes
