name: Expense and Reimbursement Workflow
document_type: Expense Claim
is_active: true
workflow_state_field: status

states:
  - state: draft
    doc_status: 0
    allow_edit: Expense and Reimbursement Operator, Expense and Reimbursement Administrator
    style: default
  - state: submitted
    doc_status: 0
    allow_edit: Expense and Reimbursement Reviewer, Expense and Reimbursement Administrator
    style: info
  - state: returned
    doc_status: 0
    allow_edit: Expense and Reimbursement Reviewer, Expense and Reimbursement Administrator
    style: info
  - state: approved
    doc_status: 0
    allow_edit: Expense and Reimbursement Reviewer, Expense and Reimbursement Administrator
    style: info
  - state: reimbursed
    doc_status: 0
    allow_edit: Expense and Reimbursement Reviewer, Expense and Reimbursement Administrator
    style: info
  - state: posted
    doc_status: 1
    allow_edit: Expense and Reimbursement Reviewer, Expense and Reimbursement Administrator
    style: success

transitions:
  - action: Advance
    from: draft
    to: submitted
    allowed: Expense and Reimbursement Operator, Expense and Reimbursement Reviewer, Expense and Reimbursement Administrator
  - action: Advance
    from: submitted
    to: returned
    allowed: Expense and Reimbursement Operator, Expense and Reimbursement Reviewer, Expense and Reimbursement Administrator
  - action: Advance
    from: returned
    to: approved
    allowed: Expense and Reimbursement Operator, Expense and Reimbursement Reviewer, Expense and Reimbursement Administrator
  - action: Advance
    from: approved
    to: reimbursed
    allowed: Expense and Reimbursement Operator, Expense and Reimbursement Reviewer, Expense and Reimbursement Administrator
  - action: Advance
    from: reimbursed
    to: posted
    allowed: Expense and Reimbursement Operator, Expense and Reimbursement Reviewer, Expense and Reimbursement Administrator
