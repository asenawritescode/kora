name: Todo
module: Tasks
title_field: title
search_fields: title
sort_field: modified
sort_order: DESC

fields:
  - fieldname: title
    fieldtype: Data
    label: Task
    reqd: true
    bold: true
    in_list_view: true
    search_index: true

  - fieldname: description
    fieldtype: Text
    label: Description

  - fieldname: assignee
    fieldtype: User
    label: Assignee
    in_list_view: true
    in_standard_filter: true
    description: Choose one existing workspace user who is responsible for completing this task.

  - fieldname: status
    fieldtype: Select
    label: Status
    options: |
      Pending
      In Progress
      Blocked
      Done
      Cancelled
    default: Pending
    in_list_view: true
    in_standard_filter: true

  - fieldname: priority
    fieldtype: Select
    label: Priority
    options: |
      Low
      Medium
      High
    default: Medium
    in_list_view: true
    in_standard_filter: true

  - fieldname: due_date
    fieldtype: Date
    label: Due Date
    in_list_view: true

  - fieldname: blocked_reason
    fieldtype: Text
    label: Blocker

  - fieldname: cancellation_reason
    fieldtype: Text
    label: Cancellation reason

  - fieldname: reopen_reason
    fieldtype: Text
    label: Reopen reason
