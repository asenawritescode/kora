name: Marketing Campaigns Workflow
document_type: Campaign
is_active: true
workflow_state_field: status

states:
  - state: draft
    doc_status: 0
    allow_edit: Marketing Campaigns Operator, Marketing Campaigns Administrator
    style: default
  - state: approved
    doc_status: 0
    allow_edit: Marketing Campaigns Reviewer, Marketing Campaigns Administrator
    style: info
  - state: scheduled
    doc_status: 0
    allow_edit: Marketing Campaigns Reviewer, Marketing Campaigns Administrator
    style: info
  - state: running
    doc_status: 0
    allow_edit: Marketing Campaigns Reviewer, Marketing Campaigns Administrator
    style: info
  - state: completed
    doc_status: 0
    allow_edit: Marketing Campaigns Reviewer, Marketing Campaigns Administrator
    style: info
  - state: analyzed
    doc_status: 1
    allow_edit: Marketing Campaigns Reviewer, Marketing Campaigns Administrator
    style: success

transitions:
  - action: Advance
    from: draft
    to: approved
    allowed: Marketing Campaigns Operator, Marketing Campaigns Reviewer, Marketing Campaigns Administrator
  - action: Advance
    from: approved
    to: scheduled
    allowed: Marketing Campaigns Operator, Marketing Campaigns Reviewer, Marketing Campaigns Administrator
  - action: Advance
    from: scheduled
    to: running
    allowed: Marketing Campaigns Operator, Marketing Campaigns Reviewer, Marketing Campaigns Administrator
  - action: Advance
    from: running
    to: completed
    allowed: Marketing Campaigns Operator, Marketing Campaigns Reviewer, Marketing Campaigns Administrator
  - action: Advance
    from: completed
    to: analyzed
    allowed: Marketing Campaigns Operator, Marketing Campaigns Reviewer, Marketing Campaigns Administrator
