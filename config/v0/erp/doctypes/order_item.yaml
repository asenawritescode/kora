---
name: Order Item
module: Sales
is_child_table: true
fields:
  - fieldname: item
    fieldtype: Link
    label: Item
    options: Item
    reqd: true
    in_list_view: true
  - fieldname: quantity
    fieldtype: Int
    label: Quantity
    reqd: true
    in_list_view: true
  - fieldname: unit_price
    fieldtype: Currency
    label: Unit Price
    reqd: true
    in_list_view: true
  - fieldname: line_total
    fieldtype: Currency
    label: Line Total
    computed: quantity * unit_price
    read_only: true
    in_list_view: true
