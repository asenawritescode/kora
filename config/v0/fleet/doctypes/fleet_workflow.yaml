name: Fleet and Transport Workflow
document_type: Trip Plan
is_active: true
workflow_state_field: status

states:
  - state: planned
    doc_status: 0
    allow_edit: Fleet and Transport Operator, Fleet and Transport Administrator
    style: default
  - state: dispatched
    doc_status: 0
    allow_edit: Fleet and Transport Reviewer, Fleet and Transport Administrator
    style: info
  - state: departed
    doc_status: 0
    allow_edit: Fleet and Transport Reviewer, Fleet and Transport Administrator
    style: info
  - state: completed
    doc_status: 0
    allow_edit: Fleet and Transport Reviewer, Fleet and Transport Administrator
    style: info
  - state: exception
    doc_status: 0
    allow_edit: Fleet and Transport Reviewer, Fleet and Transport Administrator
    style: info
  - state: retired
    doc_status: 1
    allow_edit: Fleet and Transport Reviewer, Fleet and Transport Administrator
    style: success

transitions:
  - action: Advance
    from: planned
    to: dispatched
    allowed: Fleet and Transport Operator, Fleet and Transport Reviewer, Fleet and Transport Administrator
  - action: Advance
    from: dispatched
    to: departed
    allowed: Fleet and Transport Operator, Fleet and Transport Reviewer, Fleet and Transport Administrator
  - action: Advance
    from: departed
    to: completed
    allowed: Fleet and Transport Operator, Fleet and Transport Reviewer, Fleet and Transport Administrator
  - action: Advance
    from: completed
    to: exception
    allowed: Fleet and Transport Operator, Fleet and Transport Reviewer, Fleet and Transport Administrator
  - action: Advance
    from: exception
    to: retired
    allowed: Fleet and Transport Operator, Fleet and Transport Reviewer, Fleet and Transport Administrator
