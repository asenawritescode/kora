name: Trip Plan
module: Fleet and Transport
is_submittable: true
title_field: reference
search_fields: reference, status
sort_field: modified
sort_order: DESC

fields:
  - fieldname: reference
    fieldtype: Data
    label: Reference
    reqd: true
    unique: true
    in_list_view: true
  - fieldname: assignee
    fieldtype: Data
    label: Assignee
    reqd: true
    in_list_view: true
  - fieldname: source
    fieldtype: Data
    label: Source
  - fieldname: due_date
    fieldtype: Date
    label: Due Date
  - fieldname: evidence
    fieldtype: Text
    label: Evidence
  - fieldname: status
    fieldtype: Data
    label: Status
    default: planned
    read_only: true
    in_list_view: true
  - fieldname: exception_reason
    fieldtype: Text
    label: Exception Reason
