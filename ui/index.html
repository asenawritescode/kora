<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kora | Keep records, requests, and workflows together</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
    <script>
      (function() {
        var theme = localStorage.getItem('kora-ui-theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script type="speculationrules">
      {
        "prefetch": [
          { "where": { "href_matches": "/workspace/*" }, "eagerness": "immediate" },
          { "where": { "href_matches": "/assets/*" }, "eagerness": "immediate" }
        ]
      }
    </script>
    <script id="kora-runtime-config" type="application/json">
      {
        "apiBaseUrl": "/api",
        "appName": "Kora",
        "environment": "embedded"
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#333;background:#f5f5f5">
        <div style="display:flex;flex-direction:column;align-items:center;gap:1rem;padding:2rem">
          <div style="width:48px;height:48px;border:3px solid #ddd;border-top-color:#2563eb;border-radius:50%;animation:spin 0.8s linear infinite"></div>
          <span style="font-size:1.25rem;font-weight:600">Kora</span>
          <span style="font-size:0.875rem;color:#777">Loading your workspace...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
