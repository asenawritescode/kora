# Enforced lint policy. CI runs this with --new-from-rev on pull requests, so new code must be clean
# while the existing backlog is burned down package by package. Complexity and duplication metrics
# live in .golangci-complexity.yml (make lint-complexity) and are tracked, not gated.
run:
  timeout: 8m
  tests: true
  build-tags:
    - integration

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - unused
    - ineffassign
    - unconvert
    - misspell

linters-settings:
  errcheck:
    # Calls whose error is conventionally ignored. Everything else must be handled or discarded with an
    # explicit `_ =` and a reason. Closing a file that was written to is NOT excluded: that error is
    # the last chance to learn the data did not reach disk.
    exclude-functions:
      - (*database/sql.Rows).Close          # read side; rows.Err() reports real failures
      - (*database/sql.Stmt).Close
      - (*database/sql.Conn).Close
      - (*database/sql.Tx).Rollback         # deferred after Commit; sql.ErrTxDone is expected
      - (*database/sql.DB).Close            # process/command shutdown
      - (io.Closer).Close                   # read-side closers such as response bodies
      - (net.Conn).Close
      - (io.ReadCloser).Close
      - crypto/rand.Read                    # cannot fail since Go 1.24; it aborts the process instead
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln
      - (*github.com/dop251/goja.Object).Set  # setting a property on a fresh, extensible object
      - (*github.com/dop251/goja.Runtime).Set
      - os.Remove                           # best-effort temp-file cleanup
      - (net/http.Flusher).Flush
      - (*github.com/nats-io/nats.go.Subscription).Unsubscribe
      - (*github.com/spf13/cobra.Command).MarkFlagRequired  # fails only for a misspelled flag name

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
