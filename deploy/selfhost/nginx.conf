# Example TLS edge proxy for a host-level Nginx installation. The standalone
# workspace container already handles /s/:tenant routing, same-origin API and
# realtime proxying. Keep these paths on one origin for cookies and CSRF.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name workspace.example.invalid;

    ssl_certificate     /etc/ssl/kora/fullchain.pem;
    ssl_certificate_key /etc/ssl/kora/privkey.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
