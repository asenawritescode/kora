name: Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

# Each dialect runs as three shards (scripts/ci-integration.sh KORA_IT_SHARD=i/3), each with its own
# runner and database containers. The two gate jobs keep the check names "Integration (MySQL)" and
# "Integration (Postgres)" stable for the merge rule: they pass only when every shard passed.
jobs:
  mysql:
    name: Integration (MySQL) ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: kora-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pkora-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MYSQL_ROOT_PASSWORD: kora-test-only
      KORA_IT_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Restore Go build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}-
            gobuild-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-
      - name: Test (MySQL)
        run: scripts/ci-integration.sh mysql 2>&1 | tee test.log
        shell: bash -o pipefail {0}
      - name: Summarize failures
        if: failure()
        run: grep -E 'FAIL|panic:|_test\.go:[0-9]+:' test.log | head -150 || true
      - name: Save Go build cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  mysql-gate:
    name: Integration (MySQL)
    if: always()
    needs: [mysql]
    runs-on: ubuntu-latest
    steps:
      - name: Require every MySQL shard to pass
        env:
          RESULT: ${{ needs.mysql.result }}
        run: test "$RESULT" = success

  postgres:
    name: Integration (Postgres) ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kora
          POSTGRES_PASSWORD: kora123
          POSTGRES_DB: kora
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kora -d kora"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      PGUSER: kora
      PGPASSWORD: kora123
      KORA_IT_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Restore Go build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}-
            gobuild-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-
      - name: Test (Postgres)
        run: scripts/ci-integration.sh postgres 2>&1 | tee test.log
        shell: bash -o pipefail {0}
      - name: Summarize failures
        if: failure()
        run: grep -E 'FAIL|panic:|_test\.go:[0-9]+:' test.log | head -150 || true
      - name: Save Go build cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  postgres-gate:
    name: Integration (Postgres)
    if: always()
    needs: [postgres]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Postgres shard to pass
        env:
          RESULT: ${{ needs.postgres.result }}
        run: test "$RESULT" = success
