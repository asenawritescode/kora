name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-conformance:
    name: Cross-repository contract conformance
    runs-on: ubuntu-latest
    env:
      KORA_PROJECTS_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: asenawritescode/kora-cloud
          # Pin the consumer contract revision until it is published on main.
          ref: 1541617a150e90dd6745e8ee4f433eec66f4b59b
          path: kora-cloud
      - uses: actions/checkout@v4
        with:
          repository: asenawritescode/kora-ui
          # Pin the consumer contract revision until it is published on main.
          ref: dba86c4d474c88d73afba3701ba7611977e3de3c
          path: kora-studio-mvp
      - uses: actions/checkout@v4
        with:
          repository: asenawritescode/kora-ts-extension-sdk
          # Pin the consumer contract revision until it is published on main.
          ref: 3fdb7b4d6841ded04731dda82acae4e5dd2e6589
          path: kora-ts-sdk
      - uses: actions/checkout@v4
        with:
          repository: asenawritescode/kora-mobile-app
          # Pin the consumer contract revision until it is published on main.
          ref: bc9e7f15cb0a871c18a80b81f20f03ea036b2c1f
          path: kora-mobile
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Verify producer generation and every consumer pin
        run: |
          go run ./cmd/contractgen -check
          python3 scripts/sync-contract-consumers.py --check
          python3 scripts/check-contract-fixture-manifest.py
      - name: Decode shared Engine fixtures in the TypeScript SDK
        run: |
          cd kora-ts-sdk
          bun install --frozen-lockfile
          bun test src/contract-fixtures.test.ts
          bun run build

  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: kora123
          MYSQL_DATABASE: kora_dbaccess_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kora
          POSTGRES_PASSWORD: kora123
          POSTGRES_DB: kora_recon_test
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U kora -d kora_recon_test" --health-interval=5s --health-timeout=5s --health-retries=10
      libsql:
        image: ghcr.io/tursodatabase/libsql-server:latest
        env:
          SQLD_NODE: primary
        ports:
          - 8080:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Prepare embed
        run: |
          mkdir -p workspace/dist
          touch workspace/dist/index.html

      - name: Lint (go vet)
        run: go vet ./...

      - name: Test
        run: go test ./... -v -count=1

      - name: Verify domain import boundary gate
        run: go test ./internal/application -run 'TestDomainPackagesDoNotImportOtherDomainInternals|TestDomainImportGateRejectsViolationFixture' -count=1

      - name: Test disposable MySQL integration packages
        env:
          KORA_TEST_DSN: "root:kora123@tcp(127.0.0.1:3306)/?parseTime=true&multiStatements=true"
          KORA_ANALYTICS_DISPOSABLE_MYSQL_DSN: "root:kora123@tcp(127.0.0.1:3306)/?parseTime=true&multiStatements=true"
          KORA_OUTBOX_DISPOSABLE_MYSQL_DSN: "root:kora123@tcp(127.0.0.1:3306)/?parseTime=true&multiStatements=true"
          KORA_CONFIG_DISPOSABLE_MYSQL_DSN: "root:kora123@tcp(127.0.0.1:3306)/?parseTime=true&multiStatements=true"
          KORA_DBACCESS_DISPOSABLE_MYSQL_DSN: "root:kora123@tcp(127.0.0.1:3306)/kora_dbaccess_test?parseTime=true&multiStatements=true"
          KORA_RECON_DISPOSABLE_MYSQL_DSN: "root:kora123@tcp(127.0.0.1:3306)/kora_dbaccess_test?parseTime=true&multiStatements=true"
        run: >-
          go test -tags=integration -p 1
          ./internal/dbaccess ./api ./analytics ./outbox ./site ./requests/sqlstore ./workflow/sqlstore
          ./notifications/sqlstore ./management/sqlstore -count=1 -timeout=15m

      - name: Test programmatic module owner command fixture
        env:
          KORA_ENGINE_MODULE_COMMAND_DISPOSABLE_MYSQL_DSN: "root:kora123@tcp(127.0.0.1:3306)/?parseTime=true&multiStatements=true"
        run: go test -tags=integration ./internal/engine -run TestKernelCommandCapabilityRunsSchemaAndBusinessEffectsInOneTransaction -count=1 -timeout=5m

      - name: Wait for disposable libSQL
        run: |
          for attempt in {1..45}; do
            if (echo > /dev/tcp/127.0.0.1/8080) >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "libSQL did not open port 8080" >&2
          exit 1

      - name: Test reconciliation persistence on disposable SQL dialects
        env:
          KORA_RECON_DISPOSABLE_MYSQL_DSN: "root:kora123@tcp(127.0.0.1:3306)/kora_dbaccess_test?parseTime=true&multiStatements=true"
          KORA_RECON_DISPOSABLE_POSTGRES_DSN: "postgres://kora:kora123@127.0.0.1:5432/kora_recon_test?sslmode=disable"
          KORA_RECON_DISPOSABLE_LIBSQL_DSN: "http://127.0.0.1:8080"
        run: go test -tags=integration ./recon -run TestBusinessRunPersistenceAcrossDisposableDialects -count=1 -timeout=5m

      - name: Check generated contracts
        run: go run ./cmd/contractgen -check

      - name: Test Go SDK module
        run: cd sdk && go test ./... -count=1

      - name: Vet Go SDK module
        run: cd sdk && go vet ./...

      - name: Build
        run: go build -o /dev/null .

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: cd ui && bun install --frozen-lockfile

      - name: Check Engine contract bundle
        run: cd ui && KORA_ENGINE_CONTRACT_PATH=../contract/generated/engine-v2.ts bun run check:contracts

      - name: TypeScript check
        run: cd ui && bunx tsc -b --noEmit

      - name: Build
        run: cd ui && bun run build
