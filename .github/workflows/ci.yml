name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: kora123
          MYSQL_DATABASE: kora_dbaccess_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Prepare embed
        run: |
          mkdir -p workspace/dist
          touch workspace/dist/index.html

      - name: Lint (go vet)
        run: go vet ./...

      - name: Test
        run: go test ./... -v -count=1

      - name: Test disposable MySQL integration packages
        env:
          KORA_TEST_DSN: "root:kora123@tcp(127.0.0.1:3306)/?parseTime=true&multiStatements=true"
          KORA_ANALYTICS_DISPOSABLE_MYSQL_DSN: "root:kora123@tcp(127.0.0.1:3306)/?parseTime=true&multiStatements=true"
          KORA_OUTBOX_DISPOSABLE_MYSQL_DSN: "root:kora123@tcp(127.0.0.1:3306)/?parseTime=true&multiStatements=true"
          KORA_CONFIG_DISPOSABLE_MYSQL_DSN: "root:kora123@tcp(127.0.0.1:3306)/?parseTime=true&multiStatements=true"
          KORA_DBACCESS_DISPOSABLE_MYSQL_DSN: "root:kora123@tcp(127.0.0.1:3306)/kora_dbaccess_test?parseTime=true&multiStatements=true"
        run: >-
          go test -tags=integration -p 1
          ./internal/dbaccess ./api ./analytics ./outbox ./site ./requests/sqlstore ./workflow/sqlstore
          ./notifications/sqlstore ./management/sqlstore -count=1 -timeout=15m

      - name: Check generated contracts
        run: go run ./cmd/contractgen -check

      - name: Test Go SDK module
        run: cd sdk && go test ./... -count=1

      - name: Vet Go SDK module
        run: cd sdk && go vet ./...

      - name: Build
        run: go build -o /dev/null .

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: cd ui && bun install --frozen-lockfile

      - name: Check Engine contract bundle
        run: cd ui && KORA_ENGINE_CONTRACT_PATH=../contract/generated/engine-v2.ts bun run check:contracts

      - name: TypeScript check
        run: cd ui && bunx tsc -b --noEmit

      - name: Build
        run: cd ui && bun run build
