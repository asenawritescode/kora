name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-conformance:
    name: Cross-repository contract conformance
    continue-on-error: true # non-blocking during M1; sibling repos sync after the last ticket
    runs-on: ubuntu-latest
    env:
      KORA_PROJECTS_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require repository-scoped read-only access to private contract consumers
        env:
          KORA_CLOUD_READONLY_DEPLOY_KEY: ${{ secrets.KORA_CLOUD_READONLY_DEPLOY_KEY }}
          KORA_UI_READONLY_DEPLOY_KEY: ${{ secrets.KORA_UI_READONLY_DEPLOY_KEY }}
        run: |
          if [ -z "$KORA_CLOUD_READONLY_DEPLOY_KEY" ] || [ -z "$KORA_UI_READONLY_DEPLOY_KEY" ]; then
            echo "::error::Configure read-only deploy-key secrets for kora-cloud and kora-ui."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: asenawritescode/kora-cloud
          # Consumer revision that carries the synced contract; bump it when a consumer syncs a newer one.
          ref: 25d5fff968852a52bb3172aa6d63e9b40c543b07
          path: kora-cloud
          ssh-key: ${{ secrets.KORA_CLOUD_READONLY_DEPLOY_KEY }}
      - uses: actions/checkout@v4
        with:
          repository: asenawritescode/kora-ui
          # Consumer revision that carries the synced contract; bump it when a consumer syncs a newer one.
          ref: 677c3f95815557d6420ce03b98b0fdee875f1e1d
          path: kora-studio-mvp
          ssh-key: ${{ secrets.KORA_UI_READONLY_DEPLOY_KEY }}
      - uses: actions/checkout@v4
        with:
          repository: asenawritescode/kora-ts-extension-sdk
          # Consumer revision that carries the synced contract; bump it when a consumer syncs a newer one.
          ref: 3cc7e063dd5e667e0d045e6fbea1fea0ceb68e7f
          path: kora-ts-sdk
      - uses: actions/checkout@v4
        with:
          repository: asenawritescode/kora-mobile-app
          # Consumer revision that carries the synced contract; bump it when a consumer syncs a newer one.
          ref: 177d9e642447efaab145ae4fa8ac88adcf40f292
          path: kora-mobile
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Verify producer generation and every consumer pin
        run: |
          go run ./contract/gen -check
          python3 scripts/sync-contract-consumers.py --check
          python3 scripts/check-contract-fixture-manifest.py
      - name: Decode shared Engine fixtures in the TypeScript SDK
        run: |
          cd kora-ts-sdk
          bun install --frozen-lockfile
          bun test src/contract-fixtures.test.ts
          bun run build

  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: kora123
          MYSQL_DATABASE: kora_dbaccess_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kora
          POSTGRES_PASSWORD: kora123
          POSTGRES_DB: kora_recon_test
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U kora -d kora_recon_test" --health-interval=5s --health-timeout=5s --health-retries=10
      libsql:
        image: ghcr.io/tursodatabase/libsql-server:latest
        env:
          SQLD_NODE: primary
        ports:
          - 8080:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Lint (go vet)
        run: go vet ./...

      - name: Test
        run: go test ./... -v -count=1

      - name: Verify domain import boundary gate
        run: go test ./internal/application -run 'TestDomainPackagesDoNotImportOtherDomainInternals|TestDomainImportGateRejectsViolationFixture' -count=1

      - name: Test disposable MySQL integration packages
        env:
          KORA_TEST_DSN: "root:kora123@tcp(127.0.0.1:3306)/?parseTime=true&multiStatements=true"
          KORA_ANALYTICS_DISPOSABLE_MYSQL_DSN: "root:kora123@tcp(127.0.0.1:3306)/?parseTime=true&multiStatements=true"
          KORA_OUTBOX_DISPOSABLE_MYSQL_DSN: "root:kora123@tcp(127.0.0.1:3306)/?parseTime=true&multiStatements=true"
          KORA_CONFIG_DISPOSABLE_MYSQL_DSN: "root:kora123@tcp(127.0.0.1:3306)/?parseTime=true&multiStatements=true"
          KORA_DBACCESS_DISPOSABLE_MYSQL_DSN: "root:kora123@tcp(127.0.0.1:3306)/kora_dbaccess_test?parseTime=true&multiStatements=true"
          KORA_RECON_DISPOSABLE_MYSQL_DSN: "root:kora123@tcp(127.0.0.1:3306)/kora_dbaccess_test?parseTime=true&multiStatements=true"
        run: >-
          go test -tags=integration -p 1
          ./internal/dbaccess ./internal/api ./internal/analytics ./internal/outbox ./internal/site ./internal/requests/sqlstore ./internal/workflow/sqlstore
          ./internal/notifications/sqlstore ./internal/management/sqlstore -count=1 -timeout=15m

      - name: Test programmatic module owner command fixture
        env:
          KORA_ENGINE_MODULE_COMMAND_DISPOSABLE_MYSQL_DSN: "root:kora123@tcp(127.0.0.1:3306)/?parseTime=true&multiStatements=true"
        run: go test -tags=integration ./internal/engine -run TestKernelCommandCapabilityRunsSchemaAndBusinessEffectsInOneTransaction -count=1 -timeout=5m

      - name: Wait for disposable libSQL
        run: |
          for attempt in {1..45}; do
            if (echo > /dev/tcp/127.0.0.1/8080) >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "libSQL did not open port 8080" >&2
          exit 1

      - name: Test reconciliation persistence on disposable SQL dialects
        env:
          KORA_RECON_DISPOSABLE_MYSQL_DSN: "root:kora123@tcp(127.0.0.1:3306)/kora_dbaccess_test?parseTime=true&multiStatements=true"
          KORA_RECON_DISPOSABLE_POSTGRES_DSN: "postgres://kora:kora123@127.0.0.1:5432/kora_recon_test?sslmode=disable"
          KORA_RECON_DISPOSABLE_LIBSQL_DSN: "http://127.0.0.1:8080"
        run: go test -tags=integration ./internal/recon -run TestBusinessRunPersistenceAcrossDisposableDialects -count=1 -timeout=5m

      - name: Check generated contracts
        run: go run ./contract/gen -check

      - name: Test Go SDK module
        run: cd sdk && go test ./... -count=1

      - name: Vet Go SDK module
        run: cd sdk && go vet ./...

      - name: Build
        run: go build -o /dev/null ./cmd/kora

      - name: Test release tooling
        run: make release-test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Build the tools with the repository's Go version: a prebuilt golangci-lint compiled with an
      # older Go refuses to load a module that targets a newer one.
      - name: Install golangci-lint and deadcode
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          go install golang.org/x/tools/cmd/deadcode@v0.52.0

      # Correctness, security and API-hygiene linters (.golangci.yml) on every line the PR changes.
      - name: Static analysis (changed lines)
        if: github.event_name == 'pull_request'
        run: golangci-lint run --new-from-rev=origin/${{ github.base_ref }}

      # God functions: no function may become newly over the complexity/length limits, and no function
      # already over them may get worse (.lint-baseline/complexity.json only ever shrinks).
      - name: Function complexity ratchet
        run: python3 scripts/complexity-ratchet.py

      # Dead code: no function may become unreachable from the binary and cmd/ tools
      # (.lint-baseline/deadcode.txt only ever shrinks).
      - name: Dead code ratchet
        run: python3 scripts/deadcode-ratchet.py

      # Free functions that validate or test a bare primitive are methods of a missing type
      # (.lint-baseline/primitive-funcs.txt only ever shrinks).
      - name: Primitive-function ratchet
        run: make primitive-funcs-ratchet

      # Functions take at most 5 parameters (ctx included, receiver not); more inputs go in one options struct
      # (.lint-baseline/params.json only ever shrinks).
      - name: Parameter-count ratchet
        run: make params-ratchet
