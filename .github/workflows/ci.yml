name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-conformance:
    name: Cross-repository contract conformance
    continue-on-error: true # non-blocking during M1; sibling repos sync after the last ticket
    runs-on: ubuntu-latest
    env:
      KORA_PROJECTS_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require repository-scoped read-only access to private contract consumers
        env:
          KORA_CLOUD_READONLY_DEPLOY_KEY: ${{ secrets.KORA_CLOUD_READONLY_DEPLOY_KEY }}
          KORA_UI_READONLY_DEPLOY_KEY: ${{ secrets.KORA_UI_READONLY_DEPLOY_KEY }}
        run: |
          if [ -z "$KORA_CLOUD_READONLY_DEPLOY_KEY" ] || [ -z "$KORA_UI_READONLY_DEPLOY_KEY" ]; then
            echo "::error::Configure read-only deploy-key secrets for kora-cloud and kora-ui."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: asenawritescode/kora-cloud
          # Consumer revision that carries the synced contract; bump it when a consumer syncs a newer one.
          ref: 6df3b1e97e9194475c1aa9dfc2bc240b4929045f
          path: kora-cloud
          ssh-key: ${{ secrets.KORA_CLOUD_READONLY_DEPLOY_KEY }}
      - uses: actions/checkout@v4
        with:
          repository: asenawritescode/kora-ui
          # Consumer revision that carries the synced contract; bump it when a consumer syncs a newer one.
          ref: fd24736ec29bfe174e632fb79afc0de21435176f
          path: kora-studio-mvp
          ssh-key: ${{ secrets.KORA_UI_READONLY_DEPLOY_KEY }}
      - uses: actions/checkout@v4
        with:
          repository: asenawritescode/kora-ts-extension-sdk
          # Consumer revision that carries the synced contract; bump it when a consumer syncs a newer one.
          ref: 0f86894145dbb8284b0b10ad11e518260edcaced
          path: kora-ts-sdk
      - uses: actions/checkout@v4
        with:
          repository: asenawritescode/kora-mobile-app
          # Consumer revision that carries the synced contract; bump it when a consumer syncs a newer one.
          ref: 23dab6715695509a33b913be06974b20ef35ce37
          path: kora-mobile
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Restore Go build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/go.sum') }}-
            gobuild-${{ runner.os }}-${{ github.job }}-
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Verify producer generation and every consumer pin
        run: |
          go run ./contract/gen -check
          python3 scripts/sync-contract-consumers.py --check
          python3 scripts/check-contract-fixture-manifest.py
      - name: Decode shared Engine fixtures in the TypeScript SDK
        run: |
          cd kora-ts-sdk
          bun install --frozen-lockfile
          bun test src/contract-fixtures.test.ts
          bun run build
      - name: Save Go build cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  go-unit:
    name: Go unit ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Restore Go build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}-
            gobuild-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-

      # Same flags as the former single Test step; only the package list differs per shard.
      - name: Test (shard ${{ matrix.shard }}/3)
        env:
          KORA_UNIT_SHARD: ${{ matrix.shard }}/3
        run: |
          pkgs="$(scripts/ci-unit-shard.sh)"
          echo "$pkgs"
          go test $pkgs -v -count=1

      - name: Save Go build cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  go-checks:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Restore Go build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/go.sum') }}-
            gobuild-${{ runner.os }}-${{ github.job }}-

      - name: Verify domain import boundary gate
        run: go test ./internal/application -run 'TestDomainPackagesDoNotImportOtherDomainInternals|TestDomainImportGateRejectsViolationFixture' -count=1

      - name: Check generated contracts
        run: go run ./contract/gen -check

      - name: Test Go SDK module
        run: cd sdk && go test ./... -count=1

      - name: Vet Go SDK module
        run: cd sdk && go vet ./...

      - name: Build
        run: go build -o /dev/null ./cmd/kora

      - name: Test release tooling
        run: make release-test

      - name: Save Go build cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  # Gate for the unit shards and Go checks. Required check name: Go.
  go:
    name: Go
    if: always()
    needs: [go-unit, go-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Go job to succeed
        env:
          UNIT: ${{ needs.go-unit.result }}
          CHECKS: ${{ needs.go-checks.result }}
        run: |
          if [ "$UNIT" != "success" ] || [ "$CHECKS" != "success" ]; then
            echo "::error::go-unit=$UNIT go-checks=$CHECKS"
            exit 1
          fi

  lint-vet:
    name: Lint vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Restore Go build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/go.sum') }}-
            gobuild-${{ runner.os }}-${{ github.job }}-

      # Full-repository vet. golangci below only checks changed lines.
      - name: Vet (all packages)
        run: go vet ./...

      - name: Save Go build cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  lint-static:
    name: Lint static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Restore Go build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/go.sum') }}-
            gobuild-${{ runner.os }}-${{ github.job }}-

      # Build the tool with the repository's Go version (a prebuilt golangci-lint compiled with an
      # older Go refuses to load a module that targets a newer one). Cached: installs only on a miss.
      - name: Cache golangci-lint binary
        id: golangci-bin
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: lint-tool-golangci-lint-v1.64.8-go1.25-${{ runner.os }}

      - name: Install golangci-lint
        if: steps.golangci-bin.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Cache golangci-lint results
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.golangci.yml', '**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            golangci-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.golangci.yml', '**/go.sum') }}-
            golangci-${{ runner.os }}-${{ github.job }}-

      # Correctness, security and API-hygiene linters (.golangci.yml) on every line the PR changes.
      - name: Static analysis (changed lines)
        if: github.event_name == 'pull_request'
        run: golangci-lint run --new-from-rev=origin/${{ github.base_ref }}

      - name: Save Go build cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  lint-ratchets:
    name: Lint ratchets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Restore Go build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/go.sum') }}-
            gobuild-${{ runner.os }}-${{ github.job }}-

      # The complexity ratchet runs golangci-lint; the dead-code ratchet runs deadcode. Both are
      # cached by pinned version and go-version, so each installs only on a cache miss.
      - name: Cache golangci-lint binary
        id: golangci-bin
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: lint-tool-golangci-lint-v1.64.8-go1.25-${{ runner.os }}

      - name: Install golangci-lint
        if: steps.golangci-bin.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Cache deadcode binary
        id: deadcode-bin
        uses: actions/cache@v4
        with:
          path: ~/go/bin/deadcode
          key: lint-tool-deadcode-v0.52.0-go1.25-${{ runner.os }}

      - name: Install deadcode
        if: steps.deadcode-bin.outputs.cache-hit != 'true'
        run: go install golang.org/x/tools/cmd/deadcode@v0.52.0

      # God functions: no function may become newly over the complexity/length limits, and no function
      # already over them may get worse (.lint-baseline/complexity.json only ever shrinks).
      - name: Function complexity ratchet
        run: python3 scripts/complexity-ratchet.py

      # Dead code: no function may become unreachable from the binary and cmd/ tools
      # (.lint-baseline/deadcode.txt only ever shrinks).
      - name: Dead code ratchet
        run: python3 scripts/deadcode-ratchet.py

      # Free functions that validate or test a bare primitive are methods of a missing type
      # (.lint-baseline/primitive-funcs.txt only ever shrinks).
      - name: Primitive-function ratchet
        run: make primitive-funcs-ratchet

      # Functions take at most 5 parameters (ctx included, receiver not); more inputs go in one options struct
      # (.lint-baseline/params.json only ever shrinks).
      - name: Parameter-count ratchet
        run: make params-ratchet

      - name: Save Go build cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  # Gate for the vet, static and ratchet jobs. Required check name: Lint.
  lint:
    name: Lint
    if: always()
    needs: [lint-vet, lint-static, lint-ratchets]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Lint job to succeed
        env:
          VET: ${{ needs.lint-vet.result }}
          STATIC: ${{ needs.lint-static.result }}
          RATCHETS: ${{ needs.lint-ratchets.result }}
        run: |
          if [ "$VET" != "success" ] || [ "$STATIC" != "success" ] || [ "$RATCHETS" != "success" ]; then
            echo "::error::lint-vet=$VET lint-static=$STATIC lint-ratchets=$RATCHETS"
            exit 1
          fi
